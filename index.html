<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão Premium - Assinatura Parfum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --verde-claro: #002419; --dourado: #c5a059; --dourado-brilho: #fcf6ba; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top right, var(--verde-claro), var(--verde));
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.2); 
        }

        input, textarea { 
            background: rgba(0,0,0,0.5) !important; 
            border: 1px solid rgba(197, 160, 89, 0.15) !important; 
            color: white !important; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 14px;
            width: 100%;
        }
        input:focus { border-color: var(--dourado) !important; outline: none; box-shadow: 0 0 10px rgba(197, 160, 89, 0.2); }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .btn-gold:hover { transform: scale(1.01); filter: brightness(1.1); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }

        .nav-item { opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--dourado); border-bottom: 2px solid var(--dourado); }

        .sync-height { height: auto; min-height: 700px; }
        @media (min-width: 1024px) { .sync-height { height: 750px; } }

        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN -->
    <div id="loginOverlay" class="fixed inset-0 bg-[#00120b] z-[9999] flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center shadow-2xl fade-in">
            <h1 class="font-luxury text-[#c5a059] text-3xl mb-2 tracking-[8px]">ASSINATURA</h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-[4px] mb-10">Painel de Controle Privado</p>
            <input type="password" id="pass" placeholder="SENHA MESTRA" class="text-center tracking-[12px] mb-8">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs">Entrar no Sistema</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="app" class="hidden">
        
        <header class="glass sticky top-0 z-50 mb-8 px-6 md:px-16 py-6 flex justify-between items-center">
            <div>
                <h1 class="font-luxury text-[#c5a059] text-xl tracking-widest">ASSINATURA <span class="text-white">PARFUM</span></h1>
                <p class="text-[8px] text-gray-500 uppercase tracking-widest">Gestão de Inventário</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="loadData()" class="hidden md:flex items-center gap-2 border border-[#c5a059]/40 text-[#c5a059] px-4 py-2 rounded-full text-[10px] font-bold hover:bg-[#c5a059]/10 transition">
                    SINCRONIZAR
                </button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold uppercase tracking-widest px-4">Sair</button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-6">
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- FORMULÁRIO -->
                <section id="sec-form" class="lg:col-span-5 section-content lg:block fade-in">
                    <div class="glass p-8 rounded-[40px] shadow-2xl border border-[#c5a059]/10">
                        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059]">Novo Produto</h2>
                            <button onclick="clearForm()" class="text-[9px] text-[#c5a059] border border-[#c5a059]/30 px-3 py-1 rounded-full uppercase">Reset</button>
                        </div>
                        
                        <form id="form" class="space-y-4">
                            <input type="hidden" id="id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="marca" placeholder="MARCA" required>
                                <input type="text" id="origem" placeholder="ORIGEM">
                            </div>
                            <input type="text" id="nome" placeholder="NOME DO PERFUME" required>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" step="0.01" id="preco" placeholder="PREÇO" required>
                                <input type="number" step="0.01" id="promocao" placeholder="PROMOÇÃO">
                            </div>
                            <input type="text" id="imagem" placeholder="LINK DA IMAGEM" oninput="document.getElementById('pre').src=this.value">
                            
                            <div class="glass p-4 rounded-2xl text-center">
                                <img id="pre" src="" class="h-32 w-full object-contain mx-auto rounded-lg" onerror="this.style.display='none'" onload="this.style.display='block'">
                                <p class="text-[8px] text-gray-500 mt-2 uppercase">Preview da Imagem</p>
                            </div>

                            <div class="grid grid-cols-4 gap-2">
                                <input type="number" id="doce" placeholder="DOCE" value="0">
                                <input type="number" id="amadeirado" placeholder="AMAD" value="0">
                                <input type="number" id="citrico" placeholder="CITR" value="0">
                                <input type="number" id="especiado" placeholder="ESPIC" value="0">
                            </div>

                            <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-xs uppercase shadow-xl mt-4">Salvar na Planilha</button>
                        </form>
                    </div>
                </section>

                <!-- LISTA DE ESTOQUE -->
                <section id="sec-list" class="lg:col-span-7 section-content lg:block fade-in">
                    <div class="glass p-8 rounded-[40px] shadow-2xl flex flex-col sync-height">
                        <div class="mb-6">
                            <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR PERFUME..." class="text-center text-[10px] tracking-widest !rounded-full">
                        </div>
                        
                        <div id="list" class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-4">
                            <!-- PRODUTOS APARECEM AQUI -->
                        </div>

                        <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/5">
                            <button onclick="prevPage()" class="text-[10px] text-[#c5a059] uppercase font-bold">Anterior</button>
                            <span id="pageInfo" class="text-[10px] text-gray-500 font-bold uppercase">Página 1</span>
                            <button onclick="nextPage()" class="text-[10px] text-[#c5a059] uppercase font-bold">Próxima</button>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFn1cM4jrZlSmzzeByhNy6HPSwUdU8lD-Ix9kAjBoMUiJqvfLCMtattLIh5OV9ZR0RNw/exec";
        const SENHA_MESTRA = "ticoeteco";

        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        function login() {
            if(document.getElementById('pass').value === SENHA_MESTRA) {
                document.getElementById('loginOverlay').remove();
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Senha incorreta."); }
        }

        function logout() { location.reload(); }

        async function loadData() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "<p class='text-center py-20 animate-pulse uppercase text-[10px] tracking-widest'>Sincronizando Nuvem...</p>";
            
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                // --- CORREÇÃO DA PÁGINA 1 ---
                // Filtramos apenas as linhas onde a coluna do NOME (index 3) não está vazia
                rawData = data.slice(1)
                             .filter(row => row[3] && row[3].toString().trim() !== "")
                             .reverse(); 
                
                filteredData = [...rawData];
                currentPage = 1;
                renderList();
            } catch (e) {
                listDiv.innerHTML = "<p class='text-center text-red-500 py-20'>ERRO AO CARREGAR DADOS.</p>";
            }
        }

        function renderList() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredData.slice(start, end);

            if(paginatedItems.length === 0) {
                listDiv.innerHTML = "<p class='text-center text-gray-600 py-20'>NENHUM PERFUME ENCONTRADO.</p>";
                return;
            }

            paginatedItems.forEach(row => {
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:border-[#c5a059] transition-all";
                card.onclick = () => fill(row);
                card.innerHTML = `
                    <img src="${row[6] || 'assinatura.png'}" class="w-12 h-12 object-contain bg-white/5 rounded-lg">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[8px] text-[#c5a059] font-bold uppercase truncate">${row[1]}</p>
                        <h4 class="text-[11px] font-bold truncate">${row[3]}</h4>
                        <p class="text-[10px] text-gray-500">R$ ${row[4]}</p>
                    </div>
                `;
                listDiv.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PÁGINA ${currentPage}`;
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }

        function fill(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6];
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('formTitle').innerText = "Editando Item";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('form').reset();
            document.getElementById('pre').src = "";
            document.getElementById('formTitle').innerText = "Novo Produto";
            const ids = rawData.map(r => parseInt(r[0])).filter(n => !isNaN(n));
            document.getElementById('id').value = ids.length > 0 ? Math.max(...ids) + 1 : 1;
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "SALVANDO...";
            
            const payload = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value
            };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                alert("Dados enviados! Aguarde 5 segundos para a nuvem processar.");
                btn.disabled = false; btn.innerText = "Salvar na Planilha";
                loadData();
            } catch (err) {
                alert("Erro ao conectar.");
                btn.disabled = false; btn.innerText = "Salvar na Planilha";
            }
        };

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => 
                r[1].toString().toLowerCase().includes(val) || 
                r[3].toString().toLowerCase().includes(val)
            );
            currentPage = 1;
            renderList();
        }
    </script>
</body>
</html>
