<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Assinatura Parfum - Luxury Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --verde-card: #001f15; --dourado: #c5a059; --dourado-claro: #e2c275; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            background-image: radial-gradient(circle at top right, #002b1d, var(--verde));
            background-attachment: fixed;
            min-height: 100vh;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* Estilo Vidro (Glassmorphism) */
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.2); 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* Inputs Premium */
        input, textarea, select { 
            background: rgba(0,0,0,0.3) !important; 
            border: 1px solid rgba(197, 160, 89, 0.1) !important; 
            color: white !important; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 14px;
            width: 100%;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--dourado) !important; outline: none; box-shadow: 0 0 15px rgba(197, 160, 89, 0.2); }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
            transition: 0.3s; cursor: pointer;
        }
        .btn-gold:hover { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 10px 20px rgba(197, 160, 89, 0.3); }

        .btn-danger { background: rgba(255, 0, 0, 0.1); border: 1px solid red; color: red; font-size: 10px; font-weight: bold; cursor: pointer; }
        .btn-danger:hover { background: red; color: white; }

        /* Custom Scroll */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }

        .active-tab { border-bottom: 2px solid var(--dourado); color: var(--dourado); }
        
        .card-perfume {
            background: var(--verde-card);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s;
        }
        .card-perfume:hover { border-color: var(--dourado); transform: scale(1.02); }

        .badge-gold { background: var(--dourado); color: black; font-size: 8px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- LOGIN SCREEN -->
    <div id="loginOverlay" class="fixed inset-0 bg-[#000c08] z-[9999] flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h2 class="font-luxury text-3xl text-[#c5a059] tracking-widest mb-2 uppercase">Privé</h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-[4px] mb-8">Administração de Luxo</p>
            <input type="password" id="pass" placeholder="CHAVE DE ACESSO" class="text-center tracking-[10px] mb-6 !bg-black/50">
            <button onclick="login()" class="btn-gold w-full py-4 rounded-xl">Autenticar</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="hidden max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-12 border-b border-white/10 pb-6">
            <div>
                <h1 class="font-luxury text-2xl tracking-tighter">Assinatura <span class="text-[#c5a059]">Admin</span></h1>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">Painel de Controle de Inventário</p>
            </div>
            <button onclick="location.reload()" class="text-[#c5a059] text-[10px] font-bold border border-[#c5a059] px-4 py-2 rounded-full">SINCRONIZAR</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            
            <!-- FORMULÁRIO -->
            <div class="lg:col-span-5">
                <div class="glass p-8 rounded-[30px] sticky top-8">
                    <h2 id="formTitle" class="font-luxury text-[#c5a059] text-xl mb-6 border-b border-white/5 pb-2">GERENCIAR FRAGRÂNCIA</h2>
                    <form id="perfumeForm" class="space-y-4">
                        <input type="hidden" id="id">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[10px] text-gray-500">ID ÚNICO</label><input type="text" id="idDisp" readonly class="opacity-50"></div>
                            <div><label class="text-[10px] text-gray-500">MARCA</label><input type="text" id="marca" required></div>
                        </div>

                        <div><label class="text-[10px] text-gray-500">NOME DO PERFUME</label><input type="text" id="nome" required></div>

                        <div class="grid grid-cols-3 gap-2">
                            <div><label class="text-[10px] text-gray-500">PREÇO</label><input type="number" step="0.01" id="preco" required></div>
                            <div><label class="text-[10px] text-gray-500">PROMO</label><input type="number" step="0.01" id="promocao"></div>
                            <div><label class="text-[10px] text-gray-500">ORIGEM</label><input type="text" id="origem"></div>
                        </div>

                        <div>
                            <label class="text-[10px] text-gray-500">URL DA IMAGEM</label>
                            <input type="text" id="imagem" oninput="document.getElementById('previewImg').src=this.value">
                        </div>

                        <!-- DNA OLFATIVO (0-100) -->
                        <div class="bg-black/20 p-4 rounded-xl border border-white/5">
                            <p class="text-[9px] text-[#c5a059] font-bold mb-3 tracking-widest">DNA DA FRAGRÂNCIA (%)</p>
                            <div class="grid grid-cols-4 gap-2">
                                <div><label class="text-[8px] text-gray-400">DOCE</label><input type="number" id="doce" value="0"></div>
                                <div><label class="text-[8px] text-gray-400">AMAD.</label><input type="number" id="amadeirado" value="0"></div>
                                <div><label class="text-[8px] text-gray-400">CITR.</label><input type="number" id="citrico" value="0"></div>
                                <div><label class="text-[8px] text-gray-400">ESPIC.</label><input type="number" id="especiado" value="0"></div>
                            </div>
                        </div>

                        <div class="flex items-center gap-4 py-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="maisVendido" class="w-4 h-4 accent-[#c5a059]">
                                <span class="text-xs uppercase font-bold text-[#c5a059]">Mais Vendido ★</span>
                            </label>
                        </div>

                        <div class="flex gap-2 pt-4">
                            <button type="submit" id="saveBtn" class="btn-gold flex-1 py-4 rounded-xl">SALVAR ALTERAÇÕES</button>
                            <button type="button" id="deleteBtn" class="btn-danger px-4 rounded-xl hidden" onclick="excluirPerfume()">EXCLUIR</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- LISTA -->
            <div class="lg:col-span-7">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="font-luxury text-lg uppercase tracking-widest">Coleção Privada</h2>
                    <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR..." class="w-48 !py-2 !rounded-full !bg-white/5 text-xs text-center">
                </div>

                <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Cards via JS -->
                </div>

                <div class="mt-8 flex justify-center gap-4">
                    <button onclick="prevPage()" class="text-[10px] border border-white/20 px-4 py-2 rounded-full">ANTERIOR</button>
                    <span id="pageInfo" class="text-xs self-center">PAG 1</span>
                    <button onclick="nextPage()" class="text-[10px] border border-white/20 px-4 py-2 rounded-full">PRÓXIMA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzVHuQ8rcs_ca4WqLzpZJ0jmeNeTcMENg63qpKzJzP4EBkzwsYwbz03d10ZWhNMFxLQzw/exec";
        const SENHA_MESTRA = "ticoeteco";

        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        function login() {
            if(document.getElementById('pass').value === SENHA_MESTRA) {
                document.getElementById('loginOverlay').remove();
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Chave incorreta"); }
        }

        async function loadData() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = "<p class='col-span-2 text-center py-20 animate-pulse'>Sincronizando com a nuvem...</p>";
            
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                // Filtra linhas vazias
                rawData = data.slice(1).filter(row => row[3]).reverse();
                filteredData = [...rawData];
                renderList();
            } catch (e) {
                listDiv.innerHTML = "<p class='col-span-2 text-center text-red-500'>Erro ao carregar banco de dados.</p>";
            }
        }

        function renderList() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const items = filteredData.slice(start, end);

            items.forEach(row => {
                const card = document.createElement('div');
                card.className = "card-perfume p-4 rounded-2xl flex items-center gap-4 cursor-pointer relative";
                card.onclick = () => fillForm(row);
                
                const isBest = row[8] == "1" ? '<span class="badge-gold absolute top-2 right-2">★ TOP</span>' : '';
                
                card.innerHTML = `
                    <img src="${row[6]}" class="w-14 h-14 object-contain bg-white/5 rounded-lg">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[8px] text-[#c5a059] uppercase font-bold">${row[1]}</p>
                        <h4 class="text-xs font-bold truncate">${row[3]}</h4>
                        <p class="text-[10px] text-gray-400">ID: ${row[0]} | R$ ${row[4]}</p>
                    </div>
                    ${isBest}
                `;
                listDiv.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PÁGINA ${currentPage}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('idDisp').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            
            document.getElementById('formTitle').innerText = "EDITANDO FRAGRÂNCIA";
            document.getElementById('deleteBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('formTitle').innerText = "GERENCIAR FRAGRÂNCIA";
            document.getElementById('deleteBtn').classList.add('hidden');
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "GRAVANDO...";

            // Se for novo, gera ID
            if(!document.getElementById('id').value) {
                const maxId = rawData.length > 0 ? Math.max(...rawData.map(r => parseInt(r[0]))) : 0;
                document.getElementById('id').value = maxId + 1;
            }

            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                action: 'save'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Sincronizado com sucesso!");
            location.reload();
        };

        async function excluirPerfume() {
            if(!confirm("Tem certeza que deseja apagar este perfume da planilha?")) return;
            const id = document.getElementById('id').value;
            const body = { id: id, action: 'delete' };
            
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Excluído!");
            location.reload();
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1;
            renderList();
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
    </script>
</body>
</html>
