<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin Pro - Parfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --verde-fundo: #00160f; --verde-card: #002419; --dourado: #c5a059; --borda-vidro: rgba(197, 160, 89, 0.2); }
        body { font-family: 'Montserrat', sans-serif; color: white; background: radial-gradient(circle at top right, var(--verde-card), var(--verde-fundo)) fixed; -webkit-font-smoothing: antialiased; margin: 0; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid var(--borda-vidro); }
        input, textarea, select { background: rgba(0,0,0,0.5) !important; border: 1px solid var(--borda-vidro) !important; color: white !important; padding: 12px; border-radius: 12px; outline: none; width: 100%; }
        .btn-gold { background: linear-gradient(135deg, #c5a059, #fcf6ba, #b38728); color: #00160f; font-weight: 800; text-transform: uppercase; cursor: pointer; border:none; }
        .card-perfume { background: var(--verde-card); border: 1px solid var(--borda-vidro); transition: 0.3s; min-height: 110px; }
        .card-perfume:hover { transform: translateY(-3px); border-color: var(--dourado); }
        .sync-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loginOverlay" class="fixed inset-0 bg-[#00160f] z-[9999] flex items-center justify-center">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h1 class="font-luxury text-[#c5a059] text-4xl mb-4 tracking-[10px]">PRIVÉ</h1>
            <input type="password" id="pass" placeholder="CHAVE MESTRA" class="text-center tracking-[10px] mb-6">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-sm">Entrar</button>
        </div>
    </div>

    <div id="app" style="display:none">
        <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-6">
            <h1 class="font-luxury text-[#c5a059] text-xl tracking-widest uppercase">Assinatura <span class="text-white font-sans">Parfum</span></h1>
            <div class="flex items-center gap-3">
                <button onclick="loadData()" id="syncBtn" class="bg-white/5 p-2 rounded-full border border-white/10">
                    <svg id="syncIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
                </button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold border border-red-500/30 px-3 py-1 rounded-full uppercase">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 pb-20">
            <!-- DASHBOARD -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 text-center">
                <div class="glass p-6 rounded-[30px]">
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest">Valor do Estoque Total</p>
                    <h2 id="statValorTotal" class="text-2xl font-luxury text-[#c5a059]">R$ 0,00</h2>
                </div>
                <div class="glass p-6 rounded-[30px]">
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest">Produtos em Linha</p>
                    <h2 id="statTotal" class="text-3xl font-luxury text-white">0</h2>
                </div>
                <div class="glass p-4 rounded-[30px] overflow-hidden">
                    <p class="text-[8px] text-[#c5a059] mb-2 uppercase font-bold tracking-widest">Top Marcas</p>
                    <div class="h-[80px]"><canvas id="brandBarChart"></canvas></div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- EDITOR -->
                <div class="lg:col-span-5">
                    <form id="perfumeForm" class="glass p-6 rounded-[40px] space-y-4">
                        <div class="flex justify-between items-center border-b border-white/5 pb-2">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase">Gerenciar</h2>
                            <button type="button" onclick="clearForm()" class="text-[10px] text-gray-400">Novo +</button>
                        </div>
                        <input type="hidden" id="id">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Marca</label><input type="text" id="marca" required></div>
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Público</label>
                                <select id="categoria">
                                    <option value="Masculino">Masculino</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Unissex">Unissex</option>
                                    <option value="Nicho">Nicho</option>
                                </select>
                            </div>
                        </div>
                        <div><label class="text-[9px] text-[#c5a059] uppercase">Nome</label><input type="text" id="nome" required></div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Preço</label><input type="text" id="preco" required></div>
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Oferta</label><input type="text" id="promocao"></div>
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Estoque</label><input type="number" id="quantidade" value="1"></div>
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Cupom</label><input type="text" id="cupom"></div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="flex-1"><label class="text-[9px] text-[#c5a059] uppercase">URL Imagem</label><input type="text" id="imagem"></div>
                            <img id="pre" src="" class="w-12 h-12 rounded-lg object-contain glass">
                        </div>
                        <div class="flex items-center justify-between glass p-3 rounded-2xl border-[#c5a059]/20 border">
                            <span class="text-[10px] uppercase font-bold text-[#c5a059]">Mais vendido</span>
                            <input type="checkbox" id="maisVendido" class="w-5 h-5 accent-[#c5a059]">
                        </div>
                        <button type="submit" id="saveBtn" class="btn-gold w-full py-4 rounded-xl text-xs uppercase">Salvar Alterações</button>
                        <button type="button" id="delBtn" class="hidden w-full text-red-500 text-[10px] uppercase font-bold pt-2" onclick="excluirPerfume()">Excluir Produto</button>
                    </form>
                </div>

                <!-- LISTA -->
                <div class="lg:col-span-7">
                    <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR PERFUME..." class="w-full !rounded-full text-center text-xs py-4 glass mb-6 uppercase tracking-[3px]">
                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-10">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Anterior</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500 font-bold">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Próxima</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzVHuQ8rcs_ca4WqLzpZJ0jmeNeTcMENg63qpKzJzP4EBkzwsYwbz03d10ZWhNMFxLQzw/exec"; // COLOQUE A URL QUE VOCÊ GERAR NO PASSO A PASSO
        const SENHA_MESTRA = "ticoeteco";
        
        let rawData = [], filteredData = [], currentPage = 1, brandChart;
        const itemsPerPage = 20; // Mostra mais por página

        const maskPrice = { mask: 'R$ num', blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true } } };
        IMask(document.getElementById('preco'), maskPrice);
        IMask(document.getElementById('promocao'), maskPrice);

        window.onload = () => { if(localStorage.getItem('lux_auth') === 'true') loginSucess(); };
        function login() { if(document.getElementById('pass').value === SENHA_MESTRA) { localStorage.setItem('lux_auth', 'true'); loginSucess(); } else { Swal.fire('Erro', 'Acesso Negado', 'error'); } }
        function loginSucess() { document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('app').style.display = 'block'; loadData(); }
        function logout() { localStorage.removeItem('lux_auth'); location.reload(); }

        async function loadData() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('sync-spin');
            try {
                const response = await fetch(`${WEB_APP_URL}?t=${Date.now()}`);
                const data = await response.json();
                
                rawData = data.slice(1)
                             .filter(r => r[0] !== "" && r[3] !== "")
                             .sort((a, b) => Number(a[0]) - Number(b[0]));
                
                filteredData = [...rawData];
                updateDashboard();
                renderList();
            } catch(e) {
                Swal.fire('Erro', 'Falha ao conectar com a planilha. Verifique o URL ou publique novamente.', 'error');
            } finally { syncIcon.classList.remove('sync-spin'); }
        }

        function updateDashboard() {
            let totalVal = 0, brandCounts = {};
            rawData.forEach(r => {
                const p = parseFloat(r[4].toString().replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                const q = parseInt(r[17]) || 0; 
                totalVal += (p * q);
                brandCounts[r[1]] = (brandCounts[r[1]] || 0) + 1;
            });
            document.getElementById('statValorTotal').innerText = totalVal.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
            document.getElementById('statTotal').innerText = rawData.length;
            renderBrandChart(brandCounts);
        }

        function renderBrandChart(counts) {
            const ctx = document.getElementById('brandBarChart').getContext('2d');
            if(brandChart) brandChart.destroy();
            const topBrands = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            brandChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: topBrands.map(b => b[0]), datasets: [{ data: topBrands.map(b => b[1]), backgroundColor: '#c5a059', borderRadius: 4, barThickness: 8 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: '#fff', font: { size: 8 } }, grid: { display: false } } } }
            });
        }

        function renderList() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedData = filteredData.slice(start, start + itemsPerPage);

            paginatedData.forEach(row => {
                const temOferta = row[5] && row[5].trim() !== "" && row[5] !== "R$ 0,00";
                const ehTopSeller = row[8] == "1";

                const card = document.createElement('div');
                card.className = "card-perfume p-4 rounded-3xl flex items-center gap-4 cursor-pointer relative overflow-hidden glass";
                card.onclick = () => fillForm(row);
                card.innerHTML = `
                    <div class="absolute top-2 right-2 flex flex-col gap-1 items-end z-10">
                        ${ehTopSeller ? '<span class="bg-[#c5a059] text-[#00160f] text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Top</span>' : ''}
                        ${temOferta ? '<span class="bg-red-600 text-white text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Oferta</span>' : ''}
                    </div>
                    <div class="text-[10px] font-bold text-[#c5a059] opacity-30">#${row[0]}</div>
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center p-1"><img src="${row[6] || ''}" class="max-h-full object-contain"></div>
                    <div class="flex-1 min-w-0 pr-10">
                        <p class="text-[8px] text-[#c5a059] font-black uppercase">${row[1]}</p>
                        <h4 class="text-[10px] font-bold text-white uppercase truncate">${row[3]}</h4>
                        <div class="flex justify-between mt-1 items-end">
                            <div class="flex flex-col">
                                <span class="text-[9px] ${temOferta ? 'text-gray-500 line-through' : 'text-white'}">${row[4]}</span>
                                ${temOferta ? `<span class="text-[10px] text-[#c5a059] font-bold">${row[5]}</span>` : ''}
                            </div>
                            <span class="text-[8px] text-gray-400">Est: ${row[17] || 0}</span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `Pág ${currentPage} de ${Math.ceil(filteredData.length/itemsPerPage) || 1}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5] || "";
            document.getElementById('imagem').value = row[6] || "";
            document.getElementById('pre').src = row[6] || "";
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('categoria').value = row[13] || "Masculino";
            document.getElementById('quantidade').value = row[17] || 1;
            document.getElementById('formTitle').innerText = "Editar #" + row[0];
            document.getElementById('delBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('pre').src = "";
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('formTitle').innerText = "Novo Perfume";
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";
            const body = {
                id: document.getElementById('id').value || (rawData.length > 0 ? Math.max(...rawData.map(r => Number(r[0]))) + 1 : 1).toString(),
                marca: document.getElementById('marca').value, nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value, promocao: document.getElementById('promocao').value,
                imagem: document.getElementById('imagem').value, maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                categoria: document.getElementById('categoria').value, quantidade: document.getElementById('quantidade').value, 
                action: 'save'
            };
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
                Swal.fire('Pronto!', 'Inventário atualizado!', 'success');
                setTimeout(loadData, 1500); clearForm();
            } catch(e) { Swal.fire('Erro', 'Falha ao salvar.', 'error'); }
            btn.disabled = false; btn.innerText = "Salvar Alterações";
        };

        async function excluirPerfume() {
            const res = await Swal.fire({ title: 'Excluir?', text: 'Isso removerá da planilha!', icon: 'warning', showCancelButton: true });
            if (res.isConfirmed) {
                const id = document.getElementById('id').value;
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: id, action: 'delete'}) });
                Swal.fire('Excluído!', '', 'success');
                setTimeout(loadData, 1000); clearForm();
            }
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1; renderList();
        }
        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
        document.getElementById('imagem').oninput = (e) => { document.getElementById('pre').src = e.target.value; };
    </script>
</body>
</html>
