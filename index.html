<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin - Assinatura Parfum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --dourado: #c5a059; --dourado-claro: #fcf6ba; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
            background-attachment: fixed;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(197, 160, 89, 0.15); 
        }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-gold:hover { transform: scale(1.02); filter: brightness(1.1); }

        .sync-btn-header {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--dourado);
            color: var(--dourado);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .sync-btn-header:active { transform: scale(0.95); }
        .sync-btn-header svg { transition: transform 0.5s; }
        .sync-btn-header:hover svg { transform: rotate(180deg); }

        .skeleton { background: rgba(255,255,255,0.05); animation: pulse 1.5s infinite; border-radius: 20px; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }

        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .sync-height { max-height: 850px; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- LOGIN -->
    <div id="loginOverlay" class="fixed inset-0 bg-[#00120b] z-[9999] flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[50px] w-full max-w-sm text-center shadow-2xl fade-in">
            <img src="logo.png" alt="Logo" class="w-56 mx-auto mb-10 drop-shadow-xl">
            <input type="password" id="pass" placeholder="CHAVE MESTRA" class="w-full mb-8 text-center tracking-[10px] p-4 rounded-2xl bg-black/50 border border-[#c5a059]/20 text-white outline-none focus:border-[#c5a059]">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs">Acessar Painel</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" class="hidden">
        
        <header class="glass sticky top-0 z-50 mb-8 px-6 md:px-16 py-4 flex justify-between items-center min-h-[110px]">
            <img src="logo.png" alt="Logo" class="h-16 md:h-24">
            
            <div class="flex items-center gap-4">
                <!-- BOTÃO DE SINCRONIZAR NO TOPO -->
                <button onclick="loadData()" class="sync-btn-header">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    SINCRONIZAR PLANILHA
                </button>
                <button onclick="logout()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/20">SAIR</button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-6">
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- FORMULÁRIO -->
                <section id="sec-form" class="lg:col-span-5 section-content lg:block">
                    <div class="glass p-8 md:p-10 rounded-[45px] shadow-2xl border border-[#c5a059]/20">
                        <div class="flex justify-between items-center mb-8 border-b border-[#c5a059]/10 pb-6">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-xl">Gestão de Produto</h2>
                            <button onclick="clearForm()" class="text-[9px] border border-[#c5a059] text-[#c5a059] px-4 py-1 rounded-full uppercase hover:bg-[#c5a059]/10 transition">Limpar</button>
                        </div>
                        
                        <form id="form" class="space-y-4">
                            <input type="hidden" id="id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="text" id="marca" placeholder="MARCA" class="p-4 rounded-xl bg-black/40 border border-white/10 text-sm">
                                <input type="text" id="origem" placeholder="ORIGEM" class="p-4 rounded-xl bg-black/40 border border-white/10 text-sm">
                            </div>
                            <input type="text" id="nome" placeholder="NOME DO PERFUME" class="w-full p-4 rounded-xl bg-black/40 border border-white/10 text-sm">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" step="0.01" id="preco" placeholder="PREÇO VENDA" class="p-4 rounded-xl bg-black/40 border border-white/10 text-sm">
                                <input type="number" step="0.01" id="promocao" placeholder="PREÇO PROMO" class="p-4 rounded-xl bg-black/40 border border-white/10 text-sm">
                            </div>

                            <div class="glass p-4 rounded-3xl text-center border-dashed border-[#c5a059]/30 border-2">
                                <label class="btn-gold px-6 py-2 rounded-xl cursor-pointer text-[10px] inline-block mb-2">
                                    ESCOLHER IMAGEM
                                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage(this)">
                                </label>
                                <input type="hidden" id="imagem">
                                <img id="pre" src="" class="h-32 w-full object-contain mx-auto rounded-xl">
                            </div>

                            <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-[11px] uppercase shadow-lg">Publicar Alterações</button>
                        </form>
                    </div>
                </section>

                <!-- LISTA DE ESTOQUE -->
                <section id="sec-list" class="lg:col-span-7 section-content lg:block">
                    <div class="glass p-8 rounded-[45px] shadow-2xl flex flex-col sync-height">
                        <div class="mb-6 flex gap-4">
                            <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR PERFUME..." class="w-full !rounded-full text-center text-xs py-4 glass !bg-black/40 border-[#c5a059]/20">
                        </div>
                        
                        <div id="list" class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-4">
                            <!-- O SISTEMA VAI INJETAR OS PRODUTOS AQUI -->
                            <p class="text-center text-gray-500 py-10">Aguardando sincronização...</p>
                        </div>

                        <div class="flex justify-between items-center mt-6 pt-4 border-t border-white/10">
                            <button onclick="prevPage()" class="text-[10px] uppercase font-bold text-[#c5a059]">Anterior</button>
                            <span id="pageInfo" class="text-[10px] font-bold tracking-widest text-gray-500">PÁGINA 1</span>
                            <button onclick="nextPage()" class="text-[10px] uppercase font-bold text-[#c5a059]">Próxima</button>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <script>
        // VERIFICAÇÃO DO LINK - O LINK ABAIXO É O SEU GOOGLE APPS SCRIPT
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOOqVCfJPAtxcxzYJoIssXG2H40iD1OvTL3VtLWz78VROnrgEF77ACQqFHLDdnlSYmiw/exec";
        const SENHA_ACESSO = "ticoeteco";
        const IMGBB_API_KEY = "64f9f49c0490b79361719b0959146ec6";

        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        function login() {
            if(document.getElementById('pass').value === SENHA_ACESSO) {
                document.getElementById('loginOverlay').remove();
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Chave incorreta"); }
        }

        function logout() { location.reload(); }

        async function loadData() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = `
                <div class="col-span-full py-10 text-center">
                    <div class="animate-spin h-8 w-8 border-4 border-[#c5a059] rounded-full border-t-transparent mx-auto mb-4"></div>
                    <p class="text-[10px] text-[#c5a059] animate-pulse tracking-[3px] uppercase font-bold">Sincronizando Nuvem...</p>
                </div>`;
            
            try {
                const res = await fetch(WEB_APP_URL);
                if (!res.ok) throw new Error("Erro na rede");
                const data = await res.json();
                
                // Processando dados
                rawData = data.slice(1).reverse(); // Inverte para os mais novos aparecerem primeiro
                filteredData = [...rawData];
                
                renderList();
            } catch (e) {
                listDiv.innerHTML = `<p class="text-center text-red-500 py-10">ERRO: Verifique se o Google Scripts está publicado para 'Qualquer Pessoa'.</p>`;
                console.error(e);
            }
        }

        function renderList() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredData.slice(start, end);

            if(paginatedItems.length === 0) {
                listDiv.innerHTML = "<p class='text-center text-gray-600 py-10'>Nenhum perfume encontrado.</p>";
                return;
            }

            paginatedItems.forEach(row => {
                if(!row[3]) return; // Pula se não tiver nome
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:border-[#c5a059] transition fade-in";
                card.onclick = () => fill(row);
                card.innerHTML = `
                    <img src="${row[6]}" class="w-14 h-14 object-contain bg-white/5 rounded-xl border border-white/5 shadow-inner">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[9px] text-[#c5a059] font-bold uppercase truncate">${row[1]}</p>
                        <h4 class="text-xs font-bold truncate text-white">${row[3]}</h4>
                        <p class="text-[10px] text-gray-500">R$ ${row[4]}</p>
                    </div>
                `;
                listDiv.appendChild(card);
            });

            document.getElementById('pageInfo').innerText = `PÁGINA ${currentPage}`;
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }

        function fill(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6];
            document.getElementById('formTitle').innerText = "Editando Registro";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('form').reset();
            document.getElementById('pre').src = "";
            document.getElementById('formTitle').innerText = "Gestão de Produto";
            // Sugere próximo ID
            const ids = rawData.map(r => parseInt(r[0])).filter(n => !isNaN(n));
            document.getElementById('id').value = ids.length > 0 ? Math.max(...ids) + 1 : 1;
        }

        async function uploadImage(input) {
            if (!input.files[0]) return;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Subindo Imagem...";
            
            const formData = new FormData();
            formData.append('image', input.files[0]);
            
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
            const data = await res.json();
            
            document.getElementById('imagem').value = data.data.url;
            document.getElementById('pre').src = data.data.url;
            btn.disabled = false; btn.innerText = "Publicar Alterações";
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";
            
            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                action: 'edit'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Sucesso! A planilha foi atualizada.");
            btn.disabled = false; btn.innerText = "Publicar Alterações";
            loadData();
        };

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(c => 
                c[1].toString().toLowerCase().includes(val) || 
                c[3].toString().toLowerCase().includes(val)
            );
            currentPage = 1;
            renderList();
        }
    </script>
</body>
</html>
