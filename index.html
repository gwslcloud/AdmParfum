<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lux Admin - Assinatura Parfum</title>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --dourado: #c5a059; --dourado-claro: #fcf6ba; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            background-image: radial-gradient(circle at top right, rgba(197, 160, 89, 0.05), transparent);
            background-attachment: fixed;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(197, 160, 89, 0.15); }
        .card-stats { background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid rgba(197, 160, 89, 0.1); }
        
        input, textarea, select { 
            background: rgba(0,0,0,0.4) !important; 
            border: 1px solid rgba(197, 160, 89, 0.2) !important; 
            color: white !important; 
            padding: 10px; 
            border-radius: 8px; 
            width: 100%; 
            transition: all 0.3s;
        }
        input:focus { border-color: var(--dourado) !important; box-shadow: 0 0 10px rgba(197, 160, 89, 0.2); outline: none; }
        
        label { color: var(--dourado); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 4px; display: block; }
        
        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(197, 160, 89, 0.3); }
        .btn-gold:active { transform: scale(0.98); }

        /* Scrollbar Personalizada */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--verde); }
        ::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }

        #loginOverlay { position: fixed; inset: 0; background: var(--verde); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- LOGIN -->
    <div id="loginOverlay">
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center shadow-2xl">
            <div class="mb-6">
                <div class="w-20 h-20 bg-[#c5a059]/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-[#c5a059]/30">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="1.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h2 class="font-luxury text-2xl text-[#c5a059] tracking-[4px]">DASHBOARD</h2>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Assinatura Parfum Admin</p>
            </div>
            <input type="password" id="pass" placeholder="SENHA MESTRA" class="mb-4 text-center tracking-[8px]">
            <button onclick="login()" class="btn-gold w-full py-4 rounded-xl text-xs">Entrar no Sistema</button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="app" class="hidden animate-in fade-in duration-700">
        <!-- Header -->
        <header class="p-4 md:p-6 glass flex justify-between items-center sticky top-0 z-50 mb-6">
            <div class="flex items-center gap-3">
                <span class="font-luxury text-[#c5a059] text-xl tracking-tighter">ASSINATURA <span class="text-white">PRO</span></span>
            </div>
            <div class="flex gap-2">
                <button onclick="loadData()" class="bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-[10px] uppercase font-bold transition">Sincronizar</button>
                <button onclick="logout()" class="bg-red-500/10 text-red-500 hover:bg-red-500/20 px-4 py-2 rounded-lg text-[10px] uppercase font-bold transition">Sair</button>
            </div>
        </header>

        <div class="max-w-[1600px] mx-auto px-4 md:px-8">
            
            <!-- SEÇÃO DE ANALYTICS -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="card-stats p-6 rounded-2xl">
                    <p class="text-gray-400 text-[10px] uppercase tracking-widest">Total Perfumes</p>
                    <h3 id="statTotal" class="text-3xl font-luxury mt-2">--</h3>
                </div>
                <div class="card-stats p-6 rounded-2xl">
                    <p class="text-gray-400 text-[10px] uppercase tracking-widest">Marcas Ativas</p>
                    <h3 id="statMarcas" class="text-3xl font-luxury mt-2">--</h3>
                </div>
                <div class="card-stats p-6 rounded-2xl lg:col-span-2">
                    <canvas id="brandChart" class="max-h-[80px] w-full"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- COLUNA 1: FORMULÁRIO INTELIGENTE -->
                <div class="lg:col-span-5 order-2 lg:order-1">
                    <div class="glass p-6 md:p-8 rounded-3xl sticky top-28 shadow-2xl">
                        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg">EDITAR PRODUTO</h2>
                            <button onclick="clearForm()" class="text-[10px] bg-[#c5a059]/20 text-[#c5a059] px-3 py-1 rounded-full font-bold">+ NOVO PRODUTO</button>
                        </div>
                        
                        <form id="form" class="space-y-5">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label>ID Linha (Automático)</label><input type="text" id="id" readonly class="opacity-50"></div>
                                <div><label>Marca</label><input type="text" id="marca" placeholder="Ex: Dior"></div>
                            </div>

                            <div><label>Nome da Fragrância</label><input type="text" id="nome" placeholder="Ex: Sauvage Elixir"></div>

                            <div class="grid grid-cols-3 gap-3">
                                <div><label>Preço Base</label><input type="number" step="0.01" id="preco"></div>
                                <div><label>Promoção</label><input type="number" step="0.01" id="promocao"></div>
                                <div><label>Origem</label><input type="text" id="origem"></div>
                            </div>

                            <!-- UPLOAD DE IMAGEM -->
                            <div>
                                <label>Imagem do Produto</label>
                                <div class="flex gap-2">
                                    <input type="text" id="imagem" placeholder="Link da imagem..." class="flex-1">
                                    <label class="btn-gold px-4 py-2 rounded-lg cursor-pointer flex items-center justify-center text-[10px] min-w-[100px]">
                                        <span>UPAR FOTO</span>
                                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage(this)">
                                    </label>
                                </div>
                                <div id="uploadStatus" class="text-[10px] mt-1 hidden text-yellow-500">Fazendo upload... aguarde.</div>
                                <div class="mt-4 flex justify-center">
                                    <img id="pre" src="https://via.placeholder.com/150" class="h-32 w-32 object-contain bg-white/5 rounded-xl border border-white/10 shadow-lg">
                                </div>
                            </div>

                            <div><label>Descrição Curatorial</label><textarea id="descricao" class="h-20 text-xs"></textarea></div>

                            <div class="grid grid-cols-4 gap-2">
                                <div><label>Doce</label><input type="number" id="doce" value="0"></div>
                                <div><label>Amad.</label><input type="number" id="amadeirado" value="0"></div>
                                <div><label>Citr.</label><input type="number" id="citrico" value="0"></div>
                                <div><label>Espic.</label><input type="number" id="especiado" value="0"></div>
                            </div>

                            <div class="flex items-center justify-between glass p-4 rounded-xl">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" id="maisVendido" class="w-6 h-6 rounded accent-[#c5a059]">
                                    <span class="text-xs font-bold uppercase">Destaque (Mais Vendido)</span>
                                </div>
                                <div class="w-1/3">
                                    <label>Cupom Ativo</label>
                                    <input type="text" id="cupom" class="!py-1 text-center" placeholder="Ex: VIP10">
                                </div>
                            </div>

                            <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-sm shadow-lg">Sincronizar com Planilha</button>
                        </form>
                    </div>
                </div>

                <!-- COLUNA 2: LISTA DE ESTOQUE -->
                <div class="lg:col-span-7 order-1 lg:order-2">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                        <h2 class="font-luxury text-xl">Catálogo em Tempo Real</h2>
                        <div class="relative w-full md:w-64">
                            <input type="text" id="search" onkeyup="filter()" placeholder="Buscar perfume..." class="pl-10 !rounded-full !bg-white/5 text-xs">
                            <svg class="absolute left-3 top-2.5 text-gray-500" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
                        </div>
                    </div>
                    
                    <div id="loader" class="space-y-4">
                        <div class="h-20 glass rounded-2xl loading-shimmer"></div>
                        <div class="h-20 glass rounded-2xl loading-shimmer"></div>
                        <div class="h-20 glass rounded-2xl loading-shimmer"></div>
                    </div>
                    
                    <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Cards injetados via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOOqVCfJPAtxcxzYJoIssXG2H40iD1OvTL3VtLWz78VROnrgEF77ACQqFHLDdnlSYmiw/exec";
        const SENHA_ACESSO = "ticoeteco";
        const IMGBB_API_KEY = "64f9f49c0490b79361719b0959146ec6"; // Sua chave de upload

        let rawData = [];
        let brandChart;

        // LOGIN E LOGOUT
        function login() {
            if(document.getElementById('pass').value === SENHA_ACESSO) {
                document.getElementById('loginOverlay').remove();
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Senha incorreta, acesso negado."); }
        }
        function logout() { location.reload(); }

        // CARREGAR DADOS
        async function loadData() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('list').innerHTML = "";
            
            try {
                const res = await fetch(WEB_APP_URL);
                rawData = await res.json();
                renderStats(rawData);
                renderList(rawData.slice(1));
                updateChart(rawData.slice(1));
            } catch (e) {
                alert("Erro ao carregar dados. Verifique a internet.");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        // RENDERIZAR ESTATÍSTICAS
        function renderStats(data) {
            const items = data.slice(1).filter(r => r[3]);
            document.getElementById('statTotal').innerText = items.length;
            const marcas = [...new Set(items.map(r => r[1]))].length;
            document.getElementById('statMarcas').innerText = marcas;
        }

        // RENDERIZAR LISTA
        function renderList(items) {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            
            items.forEach(row => {
                if(!row[3]) return;
                const card = document.createElement('div');
                card.className = "card-stats p-4 rounded-2xl flex items-center gap-4 cursor-pointer hover:border-[#c5a059] transition item-card animate-in slide-in-from-bottom-2 duration-500";
                card.onclick = () => fill(row);
                card.innerHTML = `
                    <div class="w-16 h-16 bg-white/5 rounded-xl flex-shrink-0 overflow-hidden border border-white/5">
                        <img src="${row[6]}" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[9px] text-[#c5a059] uppercase font-black tracking-widest">${row[1]}</p>
                        <p class="text-xs font-bold text-white truncate">${row[3]}</p>
                        <p class="text-[10px] text-gray-400 mt-1">R$ ${row[4]} | <span class="text-[#c5a059]">ID: ${row[0]}</span></p>
                    </div>
                    <div class="text-[#c5a059] opacity-50">✎</div>
                `;
                listDiv.appendChild(card);
            });
        }

        // PREENCHER FORMULÁRIO
        function fill(row) {
            document.getElementById('formTitle').innerText = "EDITAR PRODUTO";
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6] || 'https://via.placeholder.com/150';
            document.getElementById('descricao').value = row[7];
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('cupom').value = row[12] || "";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            
            // Scroll suave para o formulário no mobile
            if(window.innerWidth < 1024) document.getElementById('form').scrollIntoView({behavior: 'smooth'});
        }

        // LIMPAR FORMULÁRIO (NOVO PRODUTO)
        function clearForm() {
            document.getElementById('formTitle').innerText = "NOVO PRODUTO";
            document.getElementById('form').reset();
            document.getElementById('pre').src = 'https://via.placeholder.com/150';
            
            // Sugere próximo ID baseado no maior encontrado
            const ids = rawData.slice(1).map(r => parseInt(r[0])).filter(n => !isNaN(n));
            const nextId = ids.length > 0 ? Math.max(...ids) + 1 : 1;
            document.getElementById('id').value = nextId;
        }

        // UPLOAD DE IMAGEM (IMGBB)
        async function uploadImage(input) {
            if (!input.files || !input.files[0]) return;
            
            const status = document.getElementById('uploadStatus');
            status.classList.remove('hidden');
            
            const formData = new FormData();
            formData.append('image', input.files[0]);
            
            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                const url = data.data.url;
                document.getElementById('imagem').value = url;
                document.getElementById('pre').src = url;
                status.innerText = "✅ Upload concluído!";
            } catch (e) {
                alert("Erro no upload. Tente novamente.");
                status.classList.add('hidden');
            }
        }

        // SALVAR
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerText = "GRAVANDO NA PLANILHA...";

            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                notasTopo: "", notasCoracao: "", notasBase: "",
                cupom: document.getElementById('cupom').value,
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value
            };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
                alert("Sucesso! Os dados foram enviados.");
                loadData();
            } catch (err) {
                alert("Erro ao salvar.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Sincronizar com Planilha";
            }
        };

        // GRÁFICO DE MARCAS
        function updateChart(items) {
            const counts = {};
            items.forEach(r => { if(r[1]) counts[r[1]] = (counts[r[1]] || 0) + 1 });
            
            const labels = Object.keys(counts);
            const values = Object.values(counts);

            if (brandChart) brandChart.destroy();
            
            const ctx = document.getElementById('brandChart').getContext('2d');
            brandChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Perfumes',
                        data: values,
                        backgroundColor: '#c5a059',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { ticks: { display: false }, grid: { display: false } },
                        y: { display: false }
                    }
                }
            });
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
