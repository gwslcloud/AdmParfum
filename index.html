<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin - Assinatura Parfum</title>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CORES PADRÃO PC - FORÇADAS PARA TODOS OS DISPOSITIVOS */
        :root { 
            --verde-fundo: #00160f; 
            --verde-gradiente: #002419;
            --dourado: #c5a059; 
            --dourado-brilho: #e2c275; 
            --branco-vidro: rgba(255, 255, 255, 0.03);
            --borda-vidro: rgba(197, 160, 89, 0.2);
        }
        
        html, body {
            background-color: var(--verde-fundo) !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body { 
            font-family: 'Montserrat', sans-serif; 
            color: white;
            background-image: radial-gradient(circle at top right, var(--verde-gradiente), var(--verde-fundo)) !important;
            background-attachment: fixed;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* Estilo Vidro Premium */
        .glass { 
            background: var(--branco-vidro); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--borda-vidro); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* Inputs e Textareas */
        input, textarea { 
            background: rgba(0,0,0,0.4) !important; 
            border: 1px solid var(--borda-vidro) !important; 
            color: white !important; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--dourado) !important; box-shadow: 0 0 10px rgba(197, 160, 89, 0.3); }

        /* Botões */
        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
        }
        .btn-gold:hover { transform: scale(1.02); filter: brightness(1.1); }
        .btn-gold:active { transform: scale(0.98); }

        .sync-btn {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--dourado);
            color: var(--dourado);
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Animação Sync */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinning { animation: spin 1s linear infinite; }

        /* Cards de Perfume - Otimizados para nomes longos */
        .card-perfume {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(197, 160, 89, 0.1);
            transition: 0.3s;
            min-height: 90px;
        }
        .card-perfume:hover { border-color: var(--dourado); background: rgba(197, 160, 89, 0.05); }

        /* Estilo da Barra de Scroll */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--verde-fundo); }
        ::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }

        /* Mobile specific fixes */
        @media (max-width: 768px) {
            .mobile-header { padding: 15px !important; }
            .mobile-title { font-size: 1.2rem !important; }
            .grid-cols-2 { grid-template-columns: 1fr !important; } /* Coluna única no mobile para os cards se o nome for grande */
            .chart-box { height: 300px !important; }
        }

        #loginOverlay {
            position: fixed; inset: 0; background: var(--verde-fundo); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginOverlay">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h1 class="font-luxury text-[#c5a059] text-3xl mb-2 tracking-[8px]">PRIVÉ</h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-[4px] mb-10">Assinatura Parfum Admin</p>
            <input type="password" id="pass" placeholder="SENHA MESTRA" class="text-center tracking-[10px] mb-8">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs">Acessar</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display: none;">
        
        <!-- HEADER OTIMIZADO -->
        <header class="glass sticky top-0 z-50 mb-6 px-4 md:px-12 py-4 flex justify-between items-center mobile-header">
            <div>
                <h1 class="font-luxury text-xl md:text-2xl tracking-widest text-[#c5a059] mobile-title">ASSINATURA <span class="text-white">PRO</span></h1>
                <p class="hidden md:block text-[9px] text-gray-500 uppercase tracking-widest">Gestão de Alta Perfumaria</p>
            </div>
            <div class="flex items-center gap-2 md:gap-4">
                <button onclick="loadData()" class="sync-btn">
                    <svg id="syncIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    <span class="hidden md:inline">SINCRONIZAR</span>
                </button>
                <button onclick="logout()" class="bg-red-950/40 text-red-500 border border-red-500/20 px-4 py-2 rounded-full text-[10px] font-bold hover:bg-red-500 hover:text-white transition-all uppercase tracking-widest">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 md:px-8 pb-12">
            
            <!-- GRÁFICOS -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="glass p-6 rounded-[30px] md:col-span-2 chart-box">
                    <h3 class="text-[10px] text-[#c5a059] uppercase font-bold mb-4 tracking-widest">Distribuição por Grifes</h3>
                    <div class="h-48 md:h-64"><canvas id="brandChart"></canvas></div>
                </div>
                <div class="glass p-6 rounded-[30px] flex flex-col justify-center text-center">
                    <p class="text-gray-500 text-[10px] uppercase tracking-widest">Inventário Total</p>
                    <h4 id="statTotal" class="text-5xl font-luxury text-[#c5a059] mb-4">--</h4>
                    <p class="text-gray-500 text-[10px] uppercase tracking-widest">Marcas Ativas</p>
                    <h4 id="statMarcas" class="text-3xl font-luxury text-white">--</h4>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- EDITOR -->
                <div class="lg:col-span-5 order-2 lg:order-1">
                    <div class="glass p-6 md:p-8 rounded-[35px] shadow-2xl sticky top-24">
                        <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase">Gerenciar</h2>
                            <button onclick="clearForm()" class="text-[9px] border border-[#c5a059]/40 text-[#c5a059] px-4 py-1 rounded-full uppercase">+ Novo</button>
                        </div>
                        
                        <form id="perfumeForm" class="space-y-4">
                            <input type="hidden" id="id">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-[9px] text-gray-500 block mb-1">MARCA</label><input type="text" id="marca" required></div>
                                <div><label class="text-[9px] text-gray-500 block mb-1">ORIGEM</label><input type="text" id="origem"></div>
                            </div>

                            <div><label class="text-[9px] text-gray-500 block mb-1">NOME DO PERFUME</label><input type="text" id="nome" required></div>

                            <div class="grid grid-cols-2 gap-3">
                                <div><label class="text-[9px] text-gray-500 block mb-1">PREÇO</label><input type="number" step="0.01" id="preco" required></div>
                                <div><label class="text-[9px] text-gray-500 block mb-1">OFERTA</label><input type="number" step="0.01" id="promocao"></div>
                            </div>

                            <div><label class="text-[9px] text-gray-500 block mb-1">DESCRIÇÃO CURTA</label><textarea id="descricao" rows="2"></textarea></div>

                            <div>
                                <label class="text-[9px] text-gray-500 block mb-1">URL DA IMAGEM</label>
                                <input type="text" id="imagem" oninput="document.getElementById('pre').src=this.value">
                                <div class="glass p-4 rounded-xl flex items-center justify-center bg-black/20 mt-2 h-32">
                                    <img id="pre" src="" class="max-h-full object-contain" onerror="this.src='https://via.placeholder.com/150?text=Sem+Imagem'">
                                </div>
                            </div>

                            <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                                <p class="text-[9px] text-[#c5a059] font-bold uppercase mb-3 tracking-widest text-center">DNA (%)</p>
                                <div class="grid grid-cols-4 gap-2">
                                    <div><label class="text-[7px] text-gray-500 block mb-1">DOCE</label><input type="number" id="doce" value="0"></div>
                                    <div><label class="text-[7px] text-gray-500 block mb-1">AMAD.</label><input type="number" id="amadeirado" value="0"></div>
                                    <div><label class="text-[7px] text-gray-500 block mb-1">CITR.</label><input type="number" id="citrico" value="0"></div>
                                    <div><label class="text-[7px] text-gray-500 block mb-1">ESPIC.</label><input type="number" id="especiado" value="0"></div>
                                </div>
                            </div>

                            <div class="flex items-center justify-between glass p-4 rounded-xl border-[#c5a059]/30 border">
                                <span class="text-xs font-bold uppercase text-[#c5a059]">Selo Mais Vendido</span>
                                <input type="checkbox" id="maisVendido" class="w-6 h-6 accent-[#c5a059]">
                            </div>

                            <div class="flex gap-2 pt-2">
                                <button type="submit" id="saveBtn" class="btn-gold flex-1 py-4 rounded-xl text-xs uppercase">Publicar</button>
                                <button type="button" id="delBtn" class="bg-red-950/40 text-red-500 border border-red-500/20 px-4 rounded-xl hidden text-[10px] font-bold" onclick="excluirPerfume()">EXCLUIR</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- LISTA -->
                <div class="lg:col-span-7 order-1 lg:order-2">
                    <div class="mb-6">
                        <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR NA COLEÇÃO..." class="w-full !rounded-full !bg-white/5 text-center tracking-[4px] py-4 glass border-[#c5a059]/20">
                    </div>

                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Cards injetados -->
                    </div>

                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-6">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Anterior</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500 font-bold uppercase">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Próxima</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFn1cM4jrZlSmzzeByhNy6HPSwUdU8lD-Ix9kAjBoMUiJqvfLCMtattLIh5OV9ZR0RNw/exec";
        const SENHA_MESTRA = "ticoeteco";

        let rawData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 12;
        let brandChart;

        window.onload = () => {
            if (localStorage.getItem('ap_lux_auth') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadData();
            }
        };

        function login() {
            if(document.getElementById('pass').value === SENHA_MESTRA) {
                localStorage.setItem('ap_lux_auth', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                loadData();
            } else { alert("Acesso Negado."); }
        }

        function logout() {
            localStorage.removeItem('ap_lux_auth');
            location.reload();
        }

        async function loadData() {
            const listDiv = document.getElementById('productList');
            const icon = document.getElementById('syncIcon');
            icon.classList.add('spinning');
            listDiv.innerHTML = "<p class='col-span-full text-center py-20 opacity-50 uppercase text-[10px] tracking-widest'>Sincronizando...</p>";
            
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                rawData = data.slice(1).filter(row => row[3] && row[3] !== "").reverse();
                filteredData = [...rawData];
                
                renderStats(data);
                renderList();
                renderCharts();
            } catch (e) {
                listDiv.innerHTML = "<p class='col-span-full text-center text-red-500 py-20'>Falha na rede.</p>";
            } finally { icon.classList.remove('spinning'); }
        }

        function renderStats(data) {
            const items = data.slice(1).filter(r => r[3]);
            document.getElementById('statTotal').innerText = items.length;
            const marcas = [...new Set(items.map(r => r[1]))].length;
            document.getElementById('statMarcas').innerText = marcas;
        }

        function renderList() {
            const listDiv = document.getElementById('productList');
            listDiv.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            const items = filteredData.slice(start, start + itemsPerPage);

            items.forEach(row => {
                const card = document.createElement('div');
                card.className = "card-perfume p-4 rounded-[20px] flex items-center gap-4 cursor-pointer relative overflow-hidden";
                card.onclick = () => fillForm(row);
                
                const isBest = row[8] == "1" ? '<span class="absolute top-0 right-0 bg-[#c5a059] text-[#00160f] text-[7px] font-black px-2 py-1 rounded-bl-lg">TOP</span>' : '';
                
                card.innerHTML = `
                    <div class="w-14 h-14 bg-white/5 rounded-xl flex items-center justify-center flex-shrink-0">
                        <img src="${row[6] || 'assinatura.png'}" class="max-h-full object-contain">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[8px] text-[#c5a059] font-black uppercase truncate tracking-widest">${row[1]}</p>
                        <h4 class="text-[12px] font-bold truncate text-white uppercase leading-tight">${row[3]}</h4>
                        <p class="text-[10px] text-gray-500 font-luxury">R$ ${row[4]}</p>
                    </div>
                    ${isBest}
                `;
                listDiv.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PÁGINA ${currentPage}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6];
            document.getElementById('descricao').value = row[7] || "";
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            
            document.getElementById('formTitle').innerText = "Editando";
            document.getElementById('delBtn').style.display = 'block';
            if(window.innerWidth < 1024) window.scrollTo({top: document.getElementById('perfumeForm').offsetTop - 100, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('pre').src = "";
            document.getElementById('formTitle').innerText = "Gerenciar";
            document.getElementById('delBtn').style.display = 'none';
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";

            if(!document.getElementById('id').value) {
                const maxId = rawData.length > 0 ? Math.max(...rawData.map(r => parseInt(r[0]))) : 0;
                document.getElementById('id').value = maxId + 1;
            }

            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                action: 'save'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Sucesso!");
            loadData();
            clearForm();
            btn.disabled = false; btn.innerText = "Publicar";
        };

        async function excluirPerfume() {
            if(!confirm("Deseja apagar permanentemente?")) return;
            const id = document.getElementById('id').value;
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: id, action: 'delete'}) });
            alert("Excluído!");
            loadData();
            clearForm();
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1;
            renderList();
        }

        function renderCharts() {
            const counts = {};
            rawData.forEach(r => { if(r[1]) counts[r[1]] = (counts[r[1]] || 0) + 1 });
            const labels = Object.keys(counts);
            const values = Object.values(counts);

            if (brandChart) brandChart.destroy();
            const ctx = document.getElementById('brandChart').getContext('2d');
            
            // Cores luxuosas variadas
            const colors = ['#c5a059', '#e2c275', '#8b6d31', '#fcf6ba', '#bf953f', '#a67c00', '#d4af37'];

            brandChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: labels.map((_, i) => colors[i % colors.length]),
                        borderRadius: 5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { 
                            grid: { display: false },
                            ticks: { color: 'rgba(255,255,255,0.4)', font: { size: 9 } }
                        }
                    }
                }
            });
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
    </script>
</body>
</html>
