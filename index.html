<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - AssinaturaParfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --verde-fundo: #00160f; --verde-card: #002419; --dourado: #c5a059; --borda-vidro: rgba(197, 160, 89, 0.2); }
        body { 
            font-family: 'Montserrat', sans-serif; color: white; 
            background-color: var(--verde-fundo);
            background-image: radial-gradient(circle at top right, var(--verde-card), var(--verde-fundo));
            background-attachment: scroll; min-height: 100vh; margin: 0; 
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--borda-vidro); }
        input:not([type="checkbox"]), textarea { 
            background: rgba(0,0,0,0.4) !important; border: 1px solid var(--borda-vidro) !important; 
            color: white !important; padding: 12px; border-radius: 12px; outline: none; width: 100%; font-size: 14px; appearance: none;
        }
        input[type="checkbox"] { cursor: pointer; width: 20px; height: 20px; accent-color: var(--dourado); }
        .btn-gold { background: linear-gradient(135deg, #c5a059, #fcf6ba, #b38728); color: #00160f; font-weight: 800; text-transform: uppercase; cursor: pointer; border:none; }
        .card-perfume { background: var(--verde-card); border: 1px solid var(--borda-vidro); transition: 0.3s; cursor: pointer; }
        .sync-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        label { display: block; font-size: 10px; color: #c5a059; margin-bottom: 6px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .piramide-grid input { padding: 8px 4px !important; font-size: 11px !important; text-align: center; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="fixed inset-0 bg-[#00160f] z-[9999] flex items-center justify-center">
        <div class="glass p-10 rounded-[40px] w-full max-sm:w-[90%] text-center">
            <h1 class="font-luxury text-[#c5a059] text-4xl mb-4 tracking-[10px]">LOGIN</h1>
            <input type="password" id="pass" placeholder="SENHA" class="text-center tracking-[10px] mb-6">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-sm">Entrar</button>
        </div>
    </div>

    <div id="app" style="display:none">
        <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-6">
            <h1 class="font-luxury text-[#c5a059] text-xl tracking-widest uppercase">Admin <span class="text-white font-sans">Parfum</span></h1>
            <div class="flex items-center gap-3">
                <button onclick="loadData()" id="syncBtn" class="bg-white/5 p-2 rounded-full border border-white/10 transition-all">
                    <svg id="syncIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>
                </button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold border border-red-500/30 px-3 py-1 rounded-full uppercase">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 pb-20">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 text-center">
                <div class="glass p-6 rounded-[30px]"><p class="text-[9px] text-gray-500 uppercase">Estoque Total</p><h2 id="statValorTotal" class="text-2xl font-luxury text-[#c5a059]">R$ 0,00</h2></div>
                <div class="glass p-6 rounded-[30px]"><p class="text-[9px] text-gray-500 uppercase">Ativos</p><h2 id="statTotal" class="text-3xl font-luxury text-white">0</h2></div>
                <div class="glass p-4 rounded-[30px] overflow-hidden"><p class="text-[8px] text-[#c5a059] mb-2 uppercase font-bold">Top Marcas</p><div class="h-[80px]"><canvas id="brandBarChart"></canvas></div></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div class="lg:col-span-5">
                    <form id="perfumeForm" class="glass p-6 md:p-8 rounded-[35px] space-y-5">
                        <div class="flex justify-between items-center border-b border-white/5 pb-3">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase tracking-wider">Adicionar/Editar</h2>
                            <button type="button" onclick="clearForm()" class="text-[10px] text-gray-400 font-bold uppercase">Limpar Tudo</button>
                        </div>
                        <input type="hidden" id="id">
                        <div><label>Marca</label><input type="text" id="marca" required></div>
                        <div><label>Nome do Perfume</label><input type="text" id="nome" required></div>
                        <div><label>Descrição</label><textarea id="descricao" rows="2"></textarea></div>
                        <!-- MUDANÇA PONTUAL: Adicionado campo Origem -->
<div><label>Marca</label><input type="text" id="marca" required></div>
<div><label>Origem (Nacional / Importado / Nicho)</label><input type="text" id="origem"></div>
<div><label>Nome do Perfume</label><input type="text" id="nome" required></div>

                        <div class="grid grid-cols-3 gap-3">
                            <div><label>Preço</label><input type="text" id="preco" required></div>
                            <div><label>Oferta</label><input type="text" id="promocao"></div>
                            <div><label>Estoque</label><input type="number" id="quantidade" value="1"></div>
                        </div>

                        <div class="p-5 bg-black/30 rounded-2xl border border-white/5 space-y-4">
                            <p class="text-[11px] text-[#c5a059] font-bold uppercase">Notas Olfativas</p>
                            <div class="grid grid-cols-3 gap-3">
                                <div><label>Topo</label><input type="text" id="notasTopo" class="!py-3"></div>
                                <div><label>Coração</label><input type="text" id="notasCoracao" class="!py-3"></div>
                                <div><label>Base</label><input type="text" id="notasBase" class="!py-3"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-4 bg-black/30 rounded-2xl border border-white/5">
                                <p class="text-[10px] text-[#c5a059] font-bold mb-3 uppercase">Pirâmide %</p>
                                <div class="grid grid-cols-2 gap-2 piramide-grid">
                                    <input type="text" id="doce" placeholder="Doce">
                                    <input type="text" id="amadeirado" placeholder="Amad.">
                                    <input type="text" id="citrico" placeholder="Cítr.">
                                    <input type="text" id="especiado" placeholder="Esp.">
                                </div>
                            </div>
                            <div class="flex flex-col justify-between">
                                <div><label>Cupom</label><input type="text" id="cupom"></div>
                                <label class="flex items-center justify-between glass p-3 rounded-xl mt-2 cursor-pointer">
                                    <span class="text-[9px] font-bold text-[#c5a059] uppercase">Mais Vendido</span>
                                    <input type="checkbox" id="maisVendido" class="accent-[#c5a059]">
                                </label>
                            </div>
                        </div>

                        <div>
                            <label>URL Imagem</label>
                            <div class="flex gap-2">
                                <input type="text" id="imagem" value="https://lh3.googleusercontent.com/d/">
                                <label class="btn-gold px-4 py-2 rounded-xl cursor-pointer flex items-center justify-center text-[10px] font-bold min-w-[80px]">
                                    UPAR
                                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage(this)">
                                </label>
                            </div>
                        </div>
                        <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-xs tracking-widest">Salvar na Planilha</button>
                        <button type="button" id="delBtn" class="hidden w-full text-red-500 text-[10px] font-bold pt-2 uppercase" onclick="excluirPerfume()">Excluir Registro</button>
                    </form>
                </div>

                <div class="lg:col-span-7">
                    <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR..." class="w-full !rounded-full text-center text-xs py-5 glass mb-6 uppercase tracking-[3px]">
                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-10">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Anterior</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500 font-bold uppercase">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold uppercase">Próxima</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyjowg94D9nU7JpPal3dcWaW4rmy2UWkeITKFvEqo0almWDDixgrMax3wPlLNmfTt9-fA/exec"; 
        const SENHA_MESTRA = "ticoeteco";
        let rawData = [], filteredData = [], currentPage = 1, brandChart = null;
        const itemsPerPage = 8;

        const maskConfig = { mask: 'R$ num', blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true, radix: ',' } } };
        IMask(document.getElementById('preco'), maskConfig);
        IMask(document.getElementById('promocao'), maskConfig);

        window.onload = () => { if(localStorage.getItem('lux_auth') === 'true') loginSucess(); };
        function login() { if(document.getElementById('pass').value === SENHA_MESTRA) { localStorage.setItem('lux_auth', 'true'); loginSucess(); } else { Swal.fire('Erro', 'Senha Incorreta', 'error'); } }
        function loginSucess() { document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('app').style.display = 'block'; loadData(); }
        function logout() { localStorage.removeItem('lux_auth'); location.reload(); }

        async function uploadImage(input) {
            if (!input.files || !input.files[0]) return;
            const file = input.files[0];
            const reader = new FileReader();
            Swal.fire({ title: 'Subindo foto...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            reader.onload = async function(e) {
                const payload = { action: 'upload', fileName: file.name, fileData: e.target.result };
                try {
                    const response = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await response.json();
                    if(result.result === 'success') {
                        document.getElementById('imagem').value = result.url;
                        Swal.fire('Pronto!', 'Foto enviada.', 'success');
                    } else { throw new Error(result.message); }
                } catch (err) { Swal.fire('Erro', 'Falha no upload', 'error'); }
            };
            reader.readAsDataURL(file);
        }

        async function loadData() {
            const icon = document.getElementById('syncIcon');
            if(icon) icon.classList.add('sync-spin');
            try {
                const res = await fetch(`${WEB_APP_URL}?t=${Date.now()}`);
                const data = await res.json();
                rawData = data.slice(1).filter(r => r[0] !== "" && r[3] !== "");
                filteredData = [...rawData];
                updateDashboard();
                renderList();
            } catch(e) { console.error(e); }
            finally { if(icon) icon.classList.remove('sync-spin'); }
        }

        function updateDashboard() {
            let totalVal = 0, brandCounts = {};
            rawData.forEach(r => {
                const p = parseFloat(String(r[4]).replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                const q = parseInt(r[17]) || 0; 
                totalVal += (p * q);
                if(r[1]) brandCounts[r[1]] = (brandCounts[r[1]] || 0) + 1;
            });
            document.getElementById('statValorTotal').innerText = totalVal.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
            document.getElementById('statTotal').innerText = rawData.length;
            const ctx = document.getElementById('brandBarChart').getContext('2d');
            if(brandChart) brandChart.destroy();
            const top = Object.entries(brandCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);
            brandChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: top.map(b => b[0]), datasets: [{ data: top.map(b => b[1]), backgroundColor: '#c5a059', borderRadius: 5 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { ticks: { color: '#fff', font: { size: 9 } }, grid: { display: false } } } }
            });
        }

        function renderList() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            const paginated = filteredData.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage);
            paginated.forEach((row) => {
                const estoque = parseInt(row[17]) || 0;
                const temOferta = row[5] && row[5] != "0" && row[5] != "";
                const ehMaisVendido = row[8] == "1";
                const indisponivel = estoque <= 0;
                const div = document.createElement('div');
                div.className = `card-perfume p-4 rounded-2xl flex items-center gap-4 glass relative ${indisponivel ? 'opacity-60' : ''}`;
                div.onclick = () => fillForm(row);
                div.innerHTML = `
                    <div class="absolute top-2 right-2 flex flex-col gap-1 items-end">
                        ${ehMaisVendido ? '<span class="bg-[#c5a059] text-[#00160f] text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Mais Vendido</span>' : ''}
                        ${temOferta ? '<span class="bg-orange-500 text-white text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Promoção</span>' : ''}
                        ${indisponivel ? '<span class="bg-red-600 text-white text-[7px] font-black px-2 py-0.5 rounded-full uppercase">Esgotado</span>' : ''}
                    </div>
                    <img src="${row[6]}" class="w-12 h-12 rounded-lg object-contain bg-white/5" onerror="this.src='https://via.placeholder.com/50'">
                    <div class="flex-1 min-w-0">
                        <p class="text-[8px] text-[#c5a059] font-bold uppercase">${row[1]}</p>
                        <h4 class="text-[10px] font-bold truncate uppercase text-white">${row[3]}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[10px] text-white font-bold">R$ ${row[4]}</span>
                            <span class="text-[8px] ${indisponivel ? 'text-red-500 font-black' : 'text-gray-400'} uppercase">${indisponivel ? 'Indisponível' : 'Estoque: ' + estoque}</span>
                        </div>
                    </div>`;
                list.appendChild(div);
            });
            document.getElementById('pageInfo').innerText = `Pág ${currentPage}`;
        }

        function fillForm(row) {
            const fieldIds = ['id','marca','origem','nome','preco','promocao','imagem','descricao','maisVendido','notasTopo','notasCoracao','notasBase','cupom','doce','amadeirado','citrico','especiado','quantidade'];
            fieldIds.forEach((id, i) => {
                const el = document.getElementById(id);
                if(!el) return;
                if(el.type === 'checkbox') el.checked = row[i] == "1";
                else {
                    // Se estiver preenchendo a imagem e estiver vazio na planilha, mantém o prefixo
                    if(id === 'imagem' && (!row[i] || row[i] === "")) el.value = "https://lh3.googleusercontent.com/d/";
                    else el.value = row[i] || "";
                }
            });
            document.getElementById('formTitle').innerText = "Editando Registro";
            document.getElementById('delBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('imagem').value = "https://lh3.googleusercontent.com/d/";
            document.getElementById('formTitle').innerText = "Gerenciar";
            document.getElementById('delBtn').classList.add('hidden');
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";
            const cleanValue = (val) => val ? val.replace('R$ ', '').replace(/\./g, '').split(',')[0].replace(/\D/g, '') : "0";
            let currentId = document.getElementById('id').value;
            if (!currentId) {
                const ids = rawData.map(r => parseInt(r[0])).filter(n => !isNaN(n));
                currentId = ids.length > 0 ? (Math.max(...ids) + 1).toString() : "1";
            }
            const payload = {
                action: 'save',
                id: currentId,
                marca: document.getElementById('marca').value,
                nome: document.getElementById('nome').value,
                preco: cleanValue(document.getElementById('preco').value),
                promocao: cleanValue(document.getElementById('promocao').value),
                imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                notasTopo: document.getElementById('notasTopo').value,
                notasCoracao: document.getElementById('notasCoracao').value,
                notasBase: document.getElementById('notasBase').value,
                cupom: document.getElementById('cupom').value,
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                quantidade: Number(document.getElementById('quantidade').value) 
            };
            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                Swal.fire({ title: 'Sucesso!', text: 'Dados salvos.', icon: 'success', timer: 2000 });
                setTimeout(loadData, 2500);
                clearForm();
            } catch(e) { 
                Swal.fire('Aviso', 'Sincronização enviada.', 'info');
                setTimeout(loadData, 2500);
            } finally {
                btn.disabled = false; btn.innerText = "Salvar na Planilha";
            }
        };

        async function excluirPerfume() {
            const confirm = await Swal.fire({ title: 'Excluir?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#c5a059', confirmButtonText: 'Sim' });
            if (confirm.isConfirmed) {
                const id = document.getElementById('id').value;
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: id, action: 'delete'}) });
                Swal.fire('Excluído!', '', 'success');
                setTimeout(loadData, 2000);
                clearForm();
            }
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toString().toLowerCase().includes(val) || r[1].toString().toLowerCase().includes(val));
            currentPage = 1;
            renderList();
        }
        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
    </script>
</body>
</html>
