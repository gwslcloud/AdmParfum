<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin - Assinatura Parfum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --dourado: #c5a059; --dourado-claro: #fcf6ba; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* Estilo Vidro Premium */
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.15); 
        }

        /* Inputs de Luxo */
        input, textarea { 
            background: rgba(0,0,0,0.5) !important; 
            border: 1px solid rgba(197, 160, 89, 0.1) !important; 
            color: white !important; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--dourado) !important; box-shadow: 0 0 15px rgba(197, 160, 89, 0.1); outline: none; }

        /* Botão Dourado com Brilho */
        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Barra de Navegação Inferior (Dedicada para Mobile) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(0, 22, 15, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .nav-item.active { color: var(--dourado); }
        .nav-item svg { margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active svg { transform: translateY(-3px); filter: drop-shadow(0 0 5px var(--dourado)); }

        /* Esconder seções no mobile para trocar via nav */
        @media (max-width: 1024px) {
            .section-content { display: none; }
            .section-content.active { display: block; }
            .desktop-only { display: none; }
        }

        /* Animação de entrada */
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN PREMIUM -->
    <div id="loginOverlay" class="fixed inset-0 bg-[#00160f] z-[9999] flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center shadow-2xl fade-in">
            <img src="logo.png" alt="Logo" class="w-32 mx-auto mb-8 drop-shadow-2xl">
            <h2 class="font-luxury text-2xl text-[#c5a059] tracking-[5px] mb-2 uppercase">Acesso</h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-8">Administração Privada</p>
            
            <input type="password" id="pass" placeholder="SENHA MESTRA" class="w-full mb-6 text-center tracking-[10px]">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs">Autenticar</button>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div id="app" class="hidden pb-24">
        
        <!-- Header Desktop/Tablet -->
        <header class="p-6 flex justify-between items-center glass sticky top-0 z-50 mb-6">
            <img src="logo.png" alt="Logo" class="h-10 md:h-12">
            <div class="flex items-center gap-4">
                <span id="syncStatus" class="text-[9px] uppercase tracking-tighter text-green-500 hidden md:block">Sincronizado</span>
                <button onclick="logout()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-lg text-[10px] font-bold">SAIR</button>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4">
            
            <!-- SEÇÃO DASHBOARD (ESTATÍSTICAS) -->
            <section id="sec-dash" class="section-content active fade-in">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                    <div class="glass p-6 rounded-3xl">
                        <p class="text-gray-500 text-[10px] uppercase">Itens</p>
                        <h3 id="statTotal" class="text-3xl font-luxury mt-1">--</h3>
                    </div>
                    <div class="glass p-6 rounded-3xl">
                        <p class="text-gray-500 text-[10px] uppercase">Marcas</p>
                        <h3 id="statMarcas" class="text-3xl font-luxury mt-1">--</h3>
                    </div>
                    <div class="glass p-6 rounded-3xl col-span-2">
                        <canvas id="brandChart" class="max-h-[80px]"></canvas>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- COLUNA FORMULÁRIO -->
                <section id="sec-form" class="lg:col-span-5 section-content fade-in lg:block">
                    <div class="glass p-8 rounded-[35px] shadow-2xl">
                        <div class="flex justify-between items-center mb-8">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-xl">Novo Registro</h2>
                            <button onclick="clearForm()" class="text-[10px] border border-[#c5a059] text-[#c5a059] px-4 py-1 rounded-full uppercase font-bold">+ Limpar</button>
                        </div>
                        
                        <form id="form" class="space-y-6">
                            <input type="hidden" id="id">
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-[10px] text-[#c5a059] uppercase mb-2">Marca</label><input type="text" id="marca" placeholder="Dior" class="w-full"></div>
                                <div><label class="block text-[10px] text-[#c5a059] uppercase mb-2">Origem</label><input type="text" id="origem" placeholder="Importado" class="w-full"></div>
                            </div>

                            <div><label class="block text-[10px] text-[#c5a059] uppercase mb-2">Nome da Fragrância</label><input type="text" id="nome" class="w-full"></div>

                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-[10px] text-[#c5a059] uppercase mb-2">Preço (R$)</label><input type="number" step="0.01" id="preco" class="w-full"></div>
                                <div><label class="block text-[10px] text-[#c5a059] uppercase mb-2">Promoção (R$)</label><input type="number" step="0.01" id="promocao" class="w-full"></div>
                            </div>

                            <!-- Upload -->
                            <div class="glass p-4 rounded-2xl text-center">
                                <label class="btn-gold px-6 py-3 rounded-xl cursor-pointer text-[10px] inline-block mb-4">
                                    ESCOLHER FOTO / CÂMERA
                                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage(this)">
                                </label>
                                <input type="hidden" id="imagem">
                                <div id="uploadStatus" class="text-[9px] text-yellow-500 mb-2 hidden">Carregando imagem...</div>
                                <img id="pre" src="" class="h-32 w-32 object-contain mx-auto rounded-lg bg-black/20">
                            </div>

                            <div class="grid grid-cols-4 gap-2">
                                <div><label class="text-[9px]">DOCE</label><input type="number" id="doce" value="0"></div>
                                <div><label class="text-[9px]">AMAD.</label><input type="number" id="amadeirado" value="0"></div>
                                <div><label class="text-[9px]">CITR.</label><input type="number" id="citrico" value="0"></div>
                                <div><label class="text-[9px]">ESPIC.</label><input type="number" id="especiado" value="0"></div>
                            </div>

                            <div class="flex items-center gap-4 bg-black/20 p-4 rounded-2xl">
                                <input type="checkbox" id="maisVendido" class="w-6 h-6 accent-[#c5a059]">
                                <span class="text-xs uppercase font-bold">Destaque na Vitrine</span>
                            </div>

                            <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-sm">Sincronizar Agora</button>
                        </form>
                    </div>
                </section>

                <!-- COLUNA ESTOQUE -->
                <section id="sec-list" class="lg:col-span-7 section-content fade-in lg:block">
                    <div class="mb-6 flex gap-4">
                        <input type="text" id="search" onkeyup="filter()" placeholder="Buscar perfume..." class="flex-1 !rounded-full">
                    </div>
                    
                    <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Itens aqui -->
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- BARRA DEDICADA (MOBILE DOCK) -->
    <nav class="bottom-nav lg:hidden">
        <button class="nav-item active" onclick="switchTab('sec-dash', this)">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Início
        </button>
        <button class="nav-item" onclick="switchTab('sec-form', this)">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
            Novo
        </button>
        <button class="nav-item" onclick="switchTab('sec-list', this)">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            Estoque
        </button>
    </nav>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOOqVCfJPAtxcxzYJoIssXG2H40iD1OvTL3VtLWz78VROnrgEF77ACQqFHLDdnlSYmiw/exec";
        const SENHA_ACESSO = "ticoeteco";
        const IMGBB_API_KEY = "64f9f49c0490b79361719b0959146ec6";

        let rawData = [];
        let brandChart;

        function login() {
            if(document.getElementById('pass').value === SENHA_ACESSO) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Acesso Negado"); }
        }

        function logout() { location.reload(); }

        function switchTab(tabId, el) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function loadData() {
            const res = await fetch(WEB_APP_URL);
            rawData = await res.json();
            renderStats(rawData);
            renderList(rawData.slice(1));
            updateChart(rawData.slice(1));
        }

        function renderStats(data) {
            const items = data.slice(1).filter(r => r[3]);
            document.getElementById('statTotal').innerText = items.length;
            const marcas = [...new Set(items.map(r => r[1]))].length;
            document.getElementById('statMarcas').innerText = marcas;
        }

        function renderList(items) {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            items.reverse().forEach(row => {
                if(!row[3]) return;
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:border-[#c5a059] transition fade-in";
                card.onclick = () => { fill(row); if(window.innerWidth < 1024) switchTab('sec-form', document.querySelectorAll('.nav-item')[1]); };
                card.innerHTML = `
                    <img src="${row[6]}" class="w-16 h-16 object-contain bg-white/5 rounded-2xl">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[9px] text-[#c5a059] font-bold uppercase tracking-widest">${row[1]}</p>
                        <h4 class="text-sm font-bold truncate">${row[3]}</h4>
                        <p class="text-xs text-gray-400">R$ ${row[4]}</p>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function fill(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6];
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('formTitle').innerText = "Editando Item";
        }

        function clearForm() {
            document.getElementById('form').reset();
            document.getElementById('pre').src = "";
            document.getElementById('formTitle').innerText = "Novo Registro";
            const ids = rawData.slice(1).map(r => parseInt(r[0])).filter(n => !isNaN(n));
            document.getElementById('id').value = ids.length > 0 ? Math.max(...ids) + 1 : 1;
        }

        async function uploadImage(input) {
            if (!input.files[0]) return;
            const status = document.getElementById('uploadStatus');
            status.classList.remove('hidden');
            const formData = new FormData();
            formData.append('image', input.files[0]);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('imagem').value = data.data.url;
            document.getElementById('pre').src = data.data.url;
            status.innerText = "✅ Imagem Pronta";
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";
            
            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                action: 'edit'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Sincronizado com Sucesso!");
            btn.disabled = false; btn.innerText = "Sincronizar Agora";
            loadData();
        };

        function updateChart(items) {
            const counts = {};
            items.forEach(r => { if(r[1]) counts[r[1]] = (counts[r[1]] || 0) + 1 });
            if (brandChart) brandChart.destroy();
            const ctx = document.getElementById('brandChart').getContext('2d');
            brandChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{ data: Object.values(counts), backgroundColor: '#c5a059', borderRadius: 4 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#555', font: { size: 8 } } } } }
            });
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('#list > div').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(val) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
