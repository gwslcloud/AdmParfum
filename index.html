<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin Pro - Parfum</title>
    
    <!-- Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --verde-fundo: #00160f; --verde-gradiente: #002419;
            --dourado: #c5a059; --dourado-brilho: #e2c275;
            --branco-vidro: rgba(255, 255, 255, 0.03); --borda-vidro: rgba(197, 160, 89, 0.2);
        }
        body { font-family: 'Montserrat', sans-serif; color: white; background: radial-gradient(circle at top right, var(--verde-gradiente), var(--verde-fundo)) fixed; overflow-x: hidden; margin: 0; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: var(--branco-vidro); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--borda-vidro); }
        .card-perfume { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-perfume:hover { transform: translateY(-5px); border-color: var(--dourado); background: rgba(197, 160, 89, 0.05); }
        .skeleton { background: linear-gradient(90deg, #002419 25%, #003a29 50%, #002419 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        input, textarea, select { background: rgba(0,0,0,0.4) !important; border: 1px solid var(--borda-vidro) !important; color: white !important; padding: 12px; border-radius: 12px; outline: none; font-size: 14px; }
        input:focus { border-color: var(--dourado) !important; }
        .btn-gold { background: linear-gradient(135deg, #c5a059, #fcf6ba, #b38728); color: #00160f; font-weight: 800; text-transform: uppercase; transition: 0.3s; cursor: pointer; border:none; }
        #loginOverlay { position: fixed; inset: 0; background: var(--verde-fundo); z-index: 9999; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginOverlay">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h1 class="font-luxury text-[#c5a059] text-4xl mb-2 tracking-[10px]">PRIVÉ</h1>
            <p class="text-[9px] text-gray-500 uppercase tracking-[4px] mb-10">Admin Control</p>
            <input type="password" id="pass" placeholder="CHAVE MESTRA" class="text-center tracking-[10px] w-full mb-6">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs">Entrar</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none">
        <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-8">
            <h1 class="font-luxury text-[#c5a059] text-xl tracking-widest uppercase">Assinatura <span class="text-white">PRO</span></h1>
            <div class="flex gap-4">
                <button onclick="loadData()" class="glass px-5 py-2 rounded-full text-[10px] font-bold text-[#c5a059]">🔄 ATUALIZAR</button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold uppercase">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 pb-20">
            <!-- DASHBOARD -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 mb-2 uppercase">Valor do Estoque</p>
                    <h2 id="statValorTotal" class="text-2xl font-luxury text-[#c5a059]">R$ 0,00</h2>
                </div>
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 mb-2 uppercase">Itens Totais</p>
                    <h2 id="statTotal" class="text-2xl font-luxury text-white">0</h2>
                </div>
                <div class="glass p-6 rounded-[30px] col-span-1 md:col-span-2">
                    <canvas id="dnaRadarChart" height="150"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <!-- FORMULÁRIO -->
                <div class="lg:col-span-5">
                    <form id="perfumeForm" class="glass p-8 rounded-[35px] space-y-4 sticky top-28">
                        <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase border-b border-white/5 pb-2">Novo Produto</h2>
                        <input type="hidden" id="id">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="marca" placeholder="MARCA" required>
                            <select id="categoria">
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Unissex">Unissex</option>
                                <option value="Nicho">Nicho</option>
                            </select>
                        </div>

                        <input type="text" id="nome" placeholder="NOME DO PERFUME" required>

                        <div class="grid grid-cols-3 gap-3">
                            <input type="text" id="preco" placeholder="PREÇO" required>
                            <input type="text" id="promocao" placeholder="OFERTA">
                            <input type="number" id="quantidade" value="1">
                        </div>

                        <textarea id="descricao" rows="2" placeholder="DESCRIÇÃO CURTA"></textarea>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="text" id="topo" placeholder="NOTAS TOPO" class="text-[10px]">
                            <input type="text" id="coracao" placeholder="NOTAS CORPO" class="text-[10px]">
                            <input type="text" id="base" placeholder="NOTAS BASE" class="text-[10px]">
                        </div>

                        <div class="flex gap-4 items-center">
                            <input type="text" id="imagem" placeholder="URL DA IMAGEM" class="flex-1">
                            <img id="pre" src="" class="w-12 h-12 rounded-lg object-contain glass">
                        </div>

                        <div class="bg-black/30 p-4 rounded-2xl">
                            <p class="text-[8px] text-[#c5a059] font-bold text-center mb-2">DNA (%)</p>
                            <div class="grid grid-cols-4 gap-2">
                                <input type="number" id="doce" value="0" placeholder="DOCE">
                                <input type="number" id="amadeirado" value="0" placeholder="AMAD">
                                <input type="number" id="citrico" value="0" placeholder="CITR">
                                <input type="number" id="especiado" value="0" placeholder="ESPIC">
                            </div>
                        </div>

                        <div class="flex items-center justify-between glass p-4 rounded-xl border-[#c5a059]/20 border">
                            <span class="text-[10px] uppercase text-[#c5a059]">Mais Vendido</span>
                            <input type="checkbox" id="maisVendido">
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" id="saveBtn" class="btn-gold flex-1 py-4 rounded-xl text-xs">Publicar</button>
                            <button type="button" id="delBtn" class="hidden bg-red-950/40 text-red-500 border border-red-500/20 px-6 rounded-xl text-[10px] font-bold" onclick="excluirPerfume()">EXCLUIR</button>
                        </div>
                    </form>
                </div>

                <!-- LISTA -->
                <div class="lg:col-span-7">
                    <input type="text" id="search" onkeyup="filter()" placeholder="PESQUISAR..." class="w-full !rounded-full text-center text-xs tracking-[4px] py-4 glass mb-6">
                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-10">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold">ANTERIOR</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500 uppercase">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold">PRÓXIMA</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "SUA_URL_DO_APP_SCRIPT_AQUI"; 
        const SENHA_MESTRA = "ticoeteco";

        let rawData = [], filteredData = [], currentPage = 1, dnaChart;
        const itemsPerPage = 10;

        // Máscaras
        const maskPrice = { mask: 'R$ num', blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true } } };
        IMask(document.getElementById('preco'), maskPrice);
        IMask(document.getElementById('promocao'), maskPrice);

        window.onload = () => { if(localStorage.getItem('lux_auth') === 'true') { loginSucess(); } };

        function login() {
            if(document.getElementById('pass').value === SENHA_MESTRA) {
                localStorage.setItem('lux_auth', 'true');
                loginSucess();
            } else { Swal.fire('Erro', 'Senha Incorreta', 'error'); }
        }

        function loginSucess() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadData();
        }

        function logout() { localStorage.removeItem('lux_auth'); location.reload(); }

        async function loadData() {
            showSkeletons();
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                rawData = data.slice(1).filter(r => r[3]).reverse();
                filteredData = [...rawData];
                updateDashboard();
                renderList();
            } catch(e) { Swal.fire('Erro', 'Falha ao carregar dados', 'error'); }
        }

        function showSkeletons() {
            document.getElementById('productList').innerHTML = '<div class="skeleton h-24 rounded-2xl"></div>'.repeat(4);
        }

        function updateDashboard() {
            let totalVal = 0;
            let dnaSum = { doce: 0, amad: 0, citr: 0, espic: 0, count: 0 };

            rawData.forEach(r => {
                const p = parseFloat(r[4].toString().replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                totalVal += (p * (parseInt(r[17]) || 0));
                if(r[13] || r[14] || r[15] || r[16]) {
                    dnaSum.doce += parseInt(r[13]||0); dnaSum.amad += parseInt(r[14]||0);
                    dnaSum.citr += parseInt(r[15]||0); dnaSum.espic += parseInt(r[16]||0);
                    dnaSum.count++;
                }
            });

            document.getElementById('statValorTotal').innerText = totalVal.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
            document.getElementById('statTotal').innerText = rawData.length;
            renderRadar(dnaSum);
        }

        function renderRadar(dna) {
            const ctx = document.getElementById('dnaRadarChart').getContext('2d');
            if(dnaChart) dnaChart.destroy();
            const c = dna.count || 1;
            dnaChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DOCE', 'AMADEIRADO', 'CÍTRICO', 'ESPECIADO'],
                    datasets: [{
                        data: [dna.doce/c, dna.amad/c, dna.citr/c, dna.espic/c],
                        backgroundColor: 'rgba(197, 160, 89, 0.2)', borderColor: '#c5a059', borderWidth: 2
                    }]
                },
                options: { scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { display: false } } }, plugins: { legend: { display: false } }, maintainAspectRatio: false }
            });
        }

        function renderList() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            filteredData.slice(start, start + itemsPerPage).forEach(row => {
                const card = document.createElement('div');
                card.className = "card-perfume glass p-4 rounded-[25px] flex items-center gap-4 cursor-pointer relative group";
                card.onclick = () => fillForm(row);
                card.innerHTML = `
                    <div class="w-14 h-14 bg-white/5 rounded-xl flex items-center justify-center p-1"><img src="${row[6] || ''}" class="max-h-full object-contain"></div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[8px] text-[#c5a059] font-black uppercase tracking-widest">${row[1]}</p>
                        <h4 class="text-[11px] font-bold text-white uppercase truncate">${row[3]}</h4>
                        <div class="flex justify-between mt-1"><span class="text-[10px] text-gray-500">${row[4]}</span><span class="text-[8px] text-gray-400">Qtd: ${row[17] || 0}</span></div>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `Pág ${currentPage}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5] || "";
            document.getElementById('imagem').value = row[6] || "";
            document.getElementById('pre').src = row[6] || "";
            document.getElementById('descricao').value = row[7] || "";
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('topo').value = row[9] || "";
            document.getElementById('coracao').value = row[10] || "";
            document.getElementById('base').value = row[11] || "";
            document.getElementById('categoria').value = row[12] || "Masculino";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('quantidade').value = row[17] || 1;
            
            document.getElementById('formTitle').innerText = "Editando";
            document.getElementById('delBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";

            const body = {
                id: document.getElementById('id').value || Date.now().toString(),
                marca: document.getElementById('marca').value, categoria: document.getElementById('categoria').value,
                nome: document.getElementById('nome').value, preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value, imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value, maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                topo: document.getElementById('topo').value, coracao: document.getElementById('coracao').value, base: document.getElementById('base').value,
                doce: document.getElementById('doce').value, amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value, especiado: document.getElementById('especiado').value,
                quantidade: document.getElementById('quantidade').value, action: 'save'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            Swal.fire('Sucesso', 'Perfume salvo!', 'success');
            setTimeout(loadData, 1500);
            clearForm();
            btn.disabled = false; btn.innerText = "Publicar";
        };

        async function excluirPerfume() {
            const res = await Swal.fire({ title: 'Excluir?', text: 'Cuidado!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sim, Apagar' });
            if (res.isConfirmed) {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: document.getElementById('id').value, action: 'delete'}) });
                Swal.fire('Apagado!', '', 'success');
                setTimeout(loadData, 1000);
                clearForm();
            }
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('pre').src = "";
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('formTitle').innerText = "Novo Produto";
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1; renderList();
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
        document.getElementById('imagem').oninput = (e) => { document.getElementById('pre').src = e.target.value; };
    </script>
</body>
</html>
