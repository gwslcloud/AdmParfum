<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin Pro - Parfum</title>
    
    <!-- Frameworks Luxuosos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --verde-fundo: #00160f; 
            --verde-gradiente: #002419;
            --dourado: #c5a059; 
            --dourado-brilho: #e2c275;
            --branco-vidro: rgba(255, 255, 255, 0.03); 
            --borda-vidro: rgba(197, 160, 89, 0.2);
        }
        
        body { 
            font-family: 'Montserrat', sans-serif; color: white; 
            background: radial-gradient(circle at top right, var(--verde-gradiente), var(--verde-fundo)) fixed;
            -webkit-font-smoothing: antialiased; overflow-x: hidden;
            margin: 0;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: var(--branco-vidro); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--borda-vidro); }

        /* Animações e Micro-interações */
        .card-perfume { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-perfume:hover { 
            transform: translateY(-5px); 
            border-color: var(--dourado);
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.2);
            background: rgba(197, 160, 89, 0.05);
        }

        /* Skeleton Loading */
        .skeleton { background: linear-gradient(90deg, #002419 25%, #003a29 50%, #002419 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Inputs Estilizados */
        input, textarea, select { 
            background: rgba(0,0,0,0.4) !important; 
            border: 1px solid var(--borda-vidro) !important; 
            color: white !important; 
            padding: 12px; 
            border-radius: 12px; 
            outline: none; 
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--dourado) !important; box-shadow: 0 0 15px rgba(197, 160, 89, 0.2); }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059, #fcf6ba, #b38728); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s; 
        }
        .btn-gold:hover { filter: brightness(1.2); transform: scale(1.02); }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }

        #loginOverlay { 
            position: fixed; inset: 0; background: var(--verde-fundo); 
            z-index: 9999; display: flex; align-items: center; justify-content: center; 
            transition: opacity 0.8s ease; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginOverlay">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h1 class="font-luxury text-[#c5a059] text-4xl mb-2 tracking-[10px]">PRIVÉ</h1>
            <p class="text-[9px] text-gray-500 uppercase tracking-[4px] mb-10">Luxury Inventory System</p>
            <input type="password" id="pass" placeholder="CHAVE MESTRA" class="text-center tracking-[10px] w-full mb-6">
            <button onclick="login()" id="loginBtn" class="btn-gold w-full py-5 rounded-2xl text-xs">Acessar Painel</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app" class="hidden opacity-0 transition-opacity duration-1000">
        
        <header class="glass sticky top-0 z-50 px-6 md:px-12 py-4 flex justify-between items-center mb-8">
            <div>
                <h1 class="font-luxury text-[#c5a059] text-xl md:text-2xl tracking-widest uppercase">Assinatura <span class="text-white font-sans font-light">PRO</span></h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="loadData()" class="glass px-5 py-2 rounded-full text-[10px] font-bold text-[#c5a059] border-[#c5a059]/30 hover:bg-[#c5a059]/10 transition-all">
                    🔄 SINCRONIZAR
                </button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold uppercase tracking-widest hover:text-red-400">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 pb-20">
            
            <!-- DASHBOARD DE STATUS -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest mb-2">Valor Total Estoque</p>
                    <h2 id="statValorTotal" class="text-2xl font-luxury text-[#c5a059]">R$ 0,00</h2>
                </div>
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest mb-2">Frascos em Inventário</p>
                    <h2 id="statTotal" class="text-2xl font-luxury text-white">0</h2>
                </div>
                <div class="glass p-6 rounded-[30px] col-span-1 md:col-span-2 flex items-center justify-center">
                    <div class="w-full h-[150px]">
                        <canvas id="dnaRadarChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- EDITOR DE PRODUTO -->
                <div class="lg:col-span-5 order-2 lg:order-1">
                    <form id="perfumeForm" class="glass p-8 rounded-[35px] space-y-4 sticky top-28">
                        <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase">Novo Registro</h2>
                            <button type="button" onclick="clearForm()" class="text-[9px] text-gray-400 uppercase hover:text-white">Limpar</button>
                        </div>
                        
                        <input type="hidden" id="id">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">Grife / Marca</label>
                                <input type="text" id="marca" placeholder="Ex: Dior" required>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">Público</label>
                                <select id="categoria">
                                    <option value="Masculino">Masculino</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Unissex">Unissex</option>
                                    <option value="Nicho">Nicho</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[8px] text-gray-500 ml-2 uppercase">Nome da Fragrância</label>
                            <input type="text" id="nome" placeholder="Ex: Sauvage Elixir" required>
                        </div>

                        <div class="grid grid-cols-3 gap-3">
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">Preço</label>
                                <input type="text" id="preco" placeholder="R$ 0,00" required>
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">Oferta</label>
                                <input type="text" id="promocao" placeholder="R$ 0,00">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">Qtd</label>
                                <input type="number" id="quantidade" value="1">
                            </div>
                        </div>

                        <div class="flex flex-col gap-1">
                            <label class="text-[8px] text-gray-500 ml-2 uppercase">Breve Descrição</label>
                            <textarea id="descricao" rows="2" placeholder="Notas e sensação do perfume..."></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <input type="text" id="topo" placeholder="Notas de Topo" class="text-[10px]">
                            <input type="text" id="coracao" placeholder="Notas de Corpo" class="text-[10px]">
                            <input type="text" id="base" placeholder="Notas de Fundo" class="text-[10px]">
                        </div>

                        <div class="flex gap-4 items-end">
                            <div class="flex-1 flex flex-col gap-1">
                                <label class="text-[8px] text-gray-500 ml-2 uppercase">URL da Imagem</label>
                                <input type="text" id="imagem" placeholder="https://...">
                            </div>
                            <div class="w-16 h-16 glass rounded-xl overflow-hidden bg-black/40 flex items-center justify-center p-1">
                                <img id="pre" src="" class="max-h-full max-w-full object-contain" onerror="this.src='https://via.placeholder.com/80?text=IMG'">
                            </div>
                        </div>

                        <div class="bg-black/30 p-4 rounded-2xl border border-white/5">
                            <p class="text-[8px] text-[#c5a059] font-bold text-center mb-3 tracking-widest uppercase">DNA Olfativo (%)</p>
                            <div class="grid grid-cols-4 gap-2">
                                <div><label class="text-[7px] text-gray-500 block text-center">DOCE</label><input type="number" id="doce" value="0" class="!p-1 text-center"></div>
                                <div><label class="text-[7px] text-gray-500 block text-center">AMAD.</label><input type="number" id="amadeirado" value="0" class="!p-1 text-center"></div>
                                <div><label class="text-[7px] text-gray-500 block text-center">CITR.</label><input type="number" id="citrico" value="0" class="!p-1 text-center"></div>
                                <div><label class="text-[7px] text-gray-500 block text-center">ESPIC.</label><input type="number" id="especiado" value="0" class="!p-1 text-center"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between glass p-4 rounded-xl border-[#c5a059]/20 border">
                            <span class="text-[10px] font-bold uppercase text-[#c5a059]">Destaque (Top Seller)</span>
                            <input type="checkbox" id="maisVendido" class="w-5 h-5 accent-[#c5a059]">
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="saveBtn" class="btn-gold flex-1 py-4 rounded-xl text-xs uppercase">Salvar na Nuvem</button>
                            <button type="button" id="delBtn" class="hidden bg-red-950/40 text-red-500 border border-red-500/20 px-6 rounded-xl uppercase font-bold text-[10px]" onclick="excluirPerfume()">Excluir</button>
                        </div>
                    </form>
                </div>

                <!-- LISTA DE PRODUTOS -->
                <div class="lg:col-span-7 order-1 lg:order-2">
                    <div class="mb-6">
                        <input type="text" id="search" onkeyup="filter()" placeholder="PESQUISAR NA COLEÇÃO..." class="w-full !rounded-full text-center text-xs tracking-[4px] py-4 glass border-[#c5a059]/30">
                    </div>

                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Gerado via JavaScript -->
                    </div>

                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-10">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold hover:tracking-widest transition-all">ANTERIOR</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500 font-bold uppercase tracking-[3px]">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold hover:tracking-widest transition-all">PRÓXIMA</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzVHuQ8rcs_ca4WqLzpZJ0jmeNeTcMENg63qpKzJzP4EBkzwsYwbz03d10ZWhNMFxLQzw/exec";
        let rawData = [], filteredData = [], currentPage = 1, dnaChart;
        const itemsPerPage = 10;

        // Máscaras de Preço
        const maskOptions = { mask: 'R$ num', blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true, normalizeZeros: true } } };
        IMask(document.getElementById('preco'), maskOptions);
        IMask(document.getElementById('promocao'), maskOptions);

        window.onload = () => { if(sessionStorage.getItem('auth_prive') === 'true') loginSucess(); };

        async function login() {
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('loginBtn');
            if(!pass) return;
            
            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            try {
                // Login via GET para evitar problemas de CORS do Google
                const res = await fetch(`${WEB_APP_URL}?action=login&pass=${encodeURIComponent(pass)}`);
                const result = await res.text();
                
                if(result.trim() === "success") {
                    sessionStorage.setItem('auth_prive', 'true');
                    loginSucess();
                } else {
                    Swal.fire({ title: 'Acesso Negado', text: 'Chave mestra inválida.', icon: 'error', background: '#00160f', color: '#fff', confirmButtonColor: '#c5a059' });
                }
            } catch(e) {
                Swal.fire('Erro', 'Falha ao conectar com o servidor.', 'error');
            } finally {
                btn.innerText = "ACESSAR PAINEL";
                btn.disabled = false;
            }
        }

        function loginSucess() {
            document.getElementById('loginOverlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                setTimeout(() => document.getElementById('app').style.opacity = '1', 50);
                loadData();
            }, 800);
        }

        function logout() { sessionStorage.clear(); location.reload(); }

        async function loadData() {
            showSkeletons();
            try {
                const res = await fetch(`${WEB_APP_URL}?t=${Date.now()}`);
                const data = await res.json();
                rawData = data.slice(1).filter(r => r[3]).reverse();
                filteredData = [...rawData];
                updateDashboard();
                renderList();
            } catch(e) {
                console.error(e);
                Swal.fire('Erro', 'Não foi possível carregar o inventário.', 'warning');
            }
        }

        function showSkeletons() {
            const list = document.getElementById('productList');
            list.innerHTML = Array(6).fill(0).map(() => `
                <div class="h-24 glass rounded-[25px] p-4 flex gap-4">
                    <div class="w-16 h-16 skeleton rounded-xl"></div>
                    <div class="flex-1 space-y-2">
                        <div class="h-3 w-20 skeleton rounded"></div>
                        <div class="h-5 w-full skeleton rounded"></div>
                    </div>
                </div>
            `).join('');
        }

        function updateDashboard() {
            let totalVal = 0;
            let dnaSum = { doce: 0, amad: 0, citr: 0, espic: 0, count: 0 };

            rawData.forEach(r => {
                const preco = parseFloat(r[4].toString().replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                const qtd = parseInt(r[17]) || 0;
                totalVal += (preco * qtd);

                if(r[13] || r[14] || r[15] || r[16]) {
                    dnaSum.doce += parseInt(r[13] || 0);
                    dnaSum.amad += parseInt(r[14] || 0);
                    dnaSum.citr += parseInt(r[15] || 0);
                    dnaSum.espic += parseInt(r[16] || 0);
                    dnaSum.count++;
                }
            });

            document.getElementById('statValorTotal').innerText = totalVal.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
            document.getElementById('statTotal').innerText = rawData.length;
            renderRadar(dnaSum);
        }

        function renderRadar(dna) {
            const ctx = document.getElementById('dnaRadarChart').getContext('2d');
            if(dnaChart) dnaChart.destroy();
            const c = dna.count || 1;
            dnaChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['DOCE', 'AMADEIRADO', 'CÍTRICO', 'ESPECIADO'],
                    datasets: [{
                        data: [dna.doce/c, dna.amad/c, dna.citr/c, dna.espic/c],
                        backgroundColor: 'rgba(197, 160, 89, 0.2)',
                        borderColor: '#c5a059',
                        borderWidth: 2,
                        pointRadius: 0
                    }]
                },
                options: {
                    scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, angleLines: { color: 'rgba(255,255,255,0.05)' }, ticks: { display: false }, pointLabels: { color: '#c5a059', font: { size: 9, family: 'Cinzel' } } } },
                    plugins: { legend: { display: false } },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function renderList() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            
            filteredData.slice(start, start + itemsPerPage).forEach(row => {
                const card = document.createElement('div');
                card.className = "card-perfume glass p-4 rounded-[25px] flex items-center gap-4 cursor-pointer relative overflow-hidden group";
                card.onclick = () => fillForm(row);
                
                const isBest = row[8] == "1" ? '<div class="absolute top-0 right-0 bg-[#c5a059] text-[#00160f] text-[7px] font-black px-3 py-1 rounded-bl-xl tracking-tighter">TOP</div>' : '';
                const stockColor = row[17] > 0 ? 'text-green-500/70' : 'text-red-500/70';

                card.innerHTML = `
                    ${isBest}
                    <div class="w-16 h-16 bg-white/5 rounded-2xl flex items-center justify-center p-2 flex-shrink-0 group-hover:bg-white/10 transition-colors">
                        <img src="${row[6] || ''}" class="max-h-full object-contain" onerror="this.src='https://via.placeholder.com/80?text=IMG'">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[8px] text-[#c5a059] font-black uppercase tracking-[2px]">${row[1]}</p>
                        <h4 class="text-[11px] font-bold text-white uppercase truncate pr-4">${row[3]}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[10px] text-gray-500 font-luxury">${row[4]}</span>
                            <span class="text-[8px] font-bold uppercase ${stockColor}">Estoque: ${row[17] || 0}</span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `PÁGINA ${currentPage}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('categoria').value = row[12] || "Masculino";
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5] || "";
            document.getElementById('imagem').value = row[6] || "";
            document.getElementById('pre').src = row[6] || "";
            document.getElementById('descricao').value = row[7] || "";
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('topo').value = row[9] || "";
            document.getElementById('coracao').value = row[10] || "";
            document.getElementById('base').value = row[11] || "";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('quantidade').value = row[17] || 1;

            document.getElementById('formTitle').innerText = "Editar Fragrância";
            document.getElementById('delBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "SINCRONIZANDO...";

            const body = {
                id: document.getElementById('id').value || Date.now().toString(),
                marca: document.getElementById('marca').value,
                categoria: document.getElementById('categoria').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value,
                imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                topo: document.getElementById('topo').value,
                coracao: document.getElementById('coracao').value,
                base: document.getElementById('base').value,
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                quantidade: document.getElementById('quantidade').value,
                action: 'save'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            
            Swal.fire({ title: 'Sucesso', text: 'Registro atualizado na nuvem.', icon: 'success', background: '#00160f', color: '#fff', confirmButtonColor: '#c5a059' });
            
            setTimeout(loadData, 1500);
            clearForm();
            saveBtn.disabled = false;
            saveBtn.innerText = "SALVAR NA NUVEM";
        };

        async function excluirPerfume() {
            const res = await Swal.fire({
                title: 'Confirmar Exclusão?',
                text: "Esta fragrância será removida permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#700',
                cancelButtonColor: '#c5a059',
                confirmButtonText: 'Sim, remover',
                background: '#00160f', color: '#fff'
            });

            if (res.isConfirmed) {
                const id = document.getElementById('id').value;
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: id, action: 'delete'}) });
                Swal.fire('Removido', 'O item foi excluído.', 'success');
                setTimeout(loadData, 1000);
                clearForm();
            }
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('pre').src = "";
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('formTitle').innerText = "Novo Registro";
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1;
            renderList();
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
        
        document.getElementById('imagem').oninput = (e) => { document.getElementById('pre').src = e.target.value; };
    </script>
</body>
</html>
