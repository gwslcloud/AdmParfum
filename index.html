<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lux Admin - Assinatura Parfum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --verde: #00160f; --dourado: #c5a059; --dourado-claro: #fcf6ba; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--verde); 
            color: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-luxury { font-family: 'Cinzel', serif; }

        /* Estilo Vidro Premium */
        .glass { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.15); 
        }

        /* Scrollbar Customizada para a Lista */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--dourado); border-radius: 10px; }

        .logo-premium {
            filter: drop-shadow(0 0 8px rgba(197, 160, 89, 0.3));
            object-fit: contain;
        }

        input, textarea { 
            background: rgba(0,0,0,0.6) !important; 
            border: 1px solid rgba(197, 160, 89, 0.15) !important; 
            color: white !important; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 14px;
        }
        input:focus { border-color: var(--dourado) !important; outline: none; }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059 0%, #fcf6ba 50%, #b38728 100%); 
            color: #00160f; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
            background: rgba(0, 15, 10, 0.98); backdrop-filter: blur(25px);
            border-top: 1px solid rgba(197, 160, 89, 0.25);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255,255,255,0.3); font-size: 9px; text-transform: uppercase; }
        .nav-item.active { color: var(--dourado); }

        @media (max-width: 1024px) {
            .section-content { display: none; }
            .section-content.active { display: block; }
        }

        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Ajuste de altura para alinhar Estoque com Formulário */
        .sync-height { height: auto; max-height: 850px; overflow-y: auto; }
        @media (min-width: 1024px) {
            .sync-height { height: 850px; }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN -->
    <div id="loginOverlay" class="fixed inset-0 bg-[#00120b] z-[9999] flex items-center justify-center p-4">
        <div class="glass p-8 md:p-12 rounded-[50px] w-full max-w-sm text-center shadow-2xl fade-in">
            <img src="logo.png" alt="Logo" class="w-52 md:w-64 mx-auto mb-8 logo-premium">
            <h2 class="font-luxury text-xl text-[#c5a059] tracking-[5px] mb-8 uppercase">Acesso Restrito</h2>
            <input type="password" id="pass" placeholder="SENHA" class="w-full mb-8 text-center tracking-[10px] !bg-black/50">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-xs uppercase">Entrar</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" class="hidden pb-24">
        
        <header class="glass sticky top-0 z-50 mb-8 px-6 md:px-16 py-4 flex justify-between items-center min-h-[100px]">
            <img src="logo.png" alt="Logo" class="h-16 md:h-20 logo-premium">
            <button onclick="logout()" class="bg-red-500/5 text-red-500 px-4 py-2 rounded-xl text-[10px] font-bold border border-red-500/20">SAIR</button>
        </header>

        <div class="max-w-7xl mx-auto px-6">
            
            <!-- DASHBOARD -->
            <section id="sec-dash" class="section-content active fade-in">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10">
                    <div class="glass p-6 rounded-[30px] border-l-4 border-[#c5a059]">
                        <p class="text-gray-500 text-[9px] uppercase tracking-widest">Catálogo</p>
                        <h3 id="statTotal" class="text-3xl font-luxury text-[#c5a059]">--</h3>
                    </div>
                    <div class="glass p-6 rounded-[30px] border-l-4 border-[#c5a059]">
                        <p class="text-gray-500 text-[9px] uppercase tracking-widest">Marcas</p>
                        <h3 id="statMarcas" class="text-3xl font-luxury text-[#c5a059]">--</h3>
                    </div>
                    <div class="glass p-6 rounded-[30px] col-span-2">
                        <canvas id="brandChart" class="max-h-[80px]"></canvas>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- COLUNA FORMULÁRIO -->
                <section id="sec-form" class="lg:col-span-5 section-content fade-in lg:block">
                    <div class="glass p-8 rounded-[40px] shadow-2xl h-full border border-[#c5a059]/20">
                        <div class="flex justify-between items-center mb-8 border-b border-[#c5a059]/10 pb-4">
                            <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg">Novo Registro</h2>
                            <button onclick="clearForm()" class="text-[9px] border border-[#c5a059] text-[#c5a059] px-4 py-1 rounded-full uppercase">+ Novo</button>
                        </div>
                        
                        <form id="form" class="space-y-4">
                            <input type="hidden" id="id">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[9px] text-[#c5a059] uppercase">Marca</label><input type="text" id="marca" class="w-full"></div>
                                <div><label class="text-[9px] text-[#c5a059] uppercase">Origem</label><input type="text" id="origem" class="w-full"></div>
                            </div>
                            <div><label class="text-[9px] text-[#c5a059] uppercase">Nome</label><input type="text" id="nome" class="w-full"></div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="text-[9px] text-[#c5a059] uppercase">Preço</label><input type="number" step="0.01" id="preco" class="w-full"></div>
                                <div><label class="text-[9px] text-[#c5a059] uppercase">Oferta</label><input type="number" step="0.01" id="promocao" class="w-full"></div>
                            </div>

                            <div class="glass p-4 rounded-2xl text-center border-dashed border-[#c5a059]/20 border-2">
                                <label class="btn-gold px-6 py-2 rounded-xl cursor-pointer text-[10px] inline-block mb-2">
                                    ESCOLHER FOTO
                                    <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="uploadImage(this)">
                                </label>
                                <input type="hidden" id="imagem">
                                <img id="pre" src="" class="h-32 w-full object-contain mx-auto rounded-xl bg-black/20">
                            </div>

                            <div class="grid grid-cols-4 gap-2">
                                <div><label class="text-[8px]">DOCE</label><input type="number" id="doce" value="0"></div>
                                <div><label class="text-[8px]">AMAD.</label><input type="number" id="amadeirado" value="0"></div>
                                <div><label class="text-[8px]">CITR.</label><input type="number" id="citrico" value="0"></div>
                                <div><label class="text-[8px]">ESPIC.</label><input type="number" id="especiado" value="0"></div>
                            </div>

                            <div class="flex items-center gap-4 glass p-4 rounded-2xl">
                                <input type="checkbox" id="maisVendido" class="w-6 h-6 accent-[#c5a059]">
                                <span class="text-[10px] uppercase font-bold tracking-widest">Destaque</span>
                            </div>

                            <button type="submit" id="saveBtn" class="btn-gold w-full py-5 rounded-2xl text-xs uppercase shadow-xl">Publicar Agora</button>
                        </form>
                    </div>
                </section>

                <!-- COLUNA ESTOQUE (COM PAGINAÇÃO) -->
                <section id="sec-list" class="lg:col-span-7 section-content fade-in lg:block">
                    <div class="glass p-6 rounded-[40px] h-full shadow-2xl flex flex-col sync-height">
                        <div class="mb-6">
                            <input type="text" id="search" onkeyup="filter()" placeholder="BUSCAR PERFUME..." class="w-full !rounded-full text-center text-xs py-4 glass !bg-black/20">
                        </div>
                        
                        <!-- Lista scrollable -->
                        <div id="list" class="flex-1 overflow-y-auto custom-scroll pr-2 space-y-4">
                            <!-- Injetado via JS -->
                        </div>

                        <!-- PAGINAÇÃO -->
                        <div class="flex justify-between items-center mt-6 pt-4 border-t border-[#c5a059]/10">
                            <button onclick="prevPage()" class="text-[10px] uppercase font-bold border border-[#c5a059]/30 px-6 py-2 rounded-full hover:bg-[#c5a059]/10 transition">Anterior</button>
                            <span id="pageInfo" class="text-[10px] font-bold text-[#c5a059]">Pág. 1</span>
                            <button onclick="nextPage()" class="text-[10px] uppercase font-bold border border-[#c5a059]/30 px-6 py-2 rounded-full hover:bg-[#c5a059]/10 transition">Próximo</button>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- NAV MOBILE -->
    <nav class="bottom-nav lg:hidden">
        <button class="nav-item active" onclick="switchTab('sec-dash', this)">Status</button>
        <button class="nav-item" onclick="switchTab('sec-form', this)">Novo</button>
        <button class="nav-item" onclick="switchTab('sec-list', this)">Estoque</button>
    </nav>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyOOqVCfJPAtxcxzYJoIssXG2H40iD1OvTL3VtLWz78VROnrgEF77ACQqFHLDdnlSYmiw/exec";
        const SENHA_ACESSO = "ticoeteco";
        const IMGBB_API_KEY = "64f9f49c0490b79361719b0959146ec6";

        let rawData = [];
        let filteredData = [];
        let brandChart;
        let currentPage = 1;
        const itemsPerPage = 10;

        function login() {
            if(document.getElementById('pass').value === SENHA_ACESSO) {
                document.getElementById('loginOverlay').remove();
                document.getElementById('app').classList.remove('hidden');
                loadData();
            } else { alert("Senha Incorreta"); }
        }

        function logout() { location.reload(); }

        function switchTab(tabId, el) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        async function loadData() {
            const res = await fetch(WEB_APP_URL);
            const data = await res.json();
            rawData = data.slice(1).reverse(); // Removemos o cabeçalho e invertemos
            filteredData = [...rawData];
            renderStats(data);
            renderList();
            updateChart(rawData);
        }

        function renderStats(data) {
            const items = data.slice(1).filter(r => r[3]);
            document.getElementById('statTotal').innerText = items.length;
            const marcas = [...new Set(items.map(r => r[1]))].length;
            document.getElementById('statMarcas').innerText = marcas;
        }

        function renderList() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = "";
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filteredData.slice(start, end);

            paginatedItems.forEach(row => {
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-3xl flex items-center gap-4 cursor-pointer hover:border-[#c5a059] transition fade-in";
                card.onclick = () => { 
                    fill(row); 
                    if(window.innerWidth < 1024) switchTab('sec-form', document.querySelectorAll('.nav-item')[1]); 
                };
                card.innerHTML = `
                    <img src="${row[6]}" class="w-16 h-16 object-contain bg-white/5 rounded-2xl">
                    <div class="flex-1 overflow-hidden">
                        <p class="text-[9px] text-[#c5a059] font-bold uppercase truncate">${row[1]}</p>
                        <h4 class="text-xs font-bold truncate">${row[3]}</h4>
                        <p class="text-xs text-gray-500">R$ ${row[4]}</p>
                    </div>
                `;
                listDiv.appendChild(card);
            });

            document.getElementById('pageInfo').innerText = `Pág. ${currentPage}`;
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }

        function fill(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('origem').value = row[2];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5];
            document.getElementById('imagem').value = row[6];
            document.getElementById('pre').src = row[6];
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('formTitle').innerText = "Editando Item";
        }

        function clearForm() {
            document.getElementById('form').reset();
            document.getElementById('pre').src = "";
            document.getElementById('formTitle').innerText = "Novo Registro";
            const ids = rawData.map(r => parseInt(r[0])).filter(n => !isNaN(n));
            document.getElementById('id').value = ids.length > 0 ? Math.max(...ids) + 1 : 1;
        }

        async function uploadImage(input) {
            if (!input.files[0]) return;
            const formData = new FormData();
            formData.append('image', input.files[0]);
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('imagem').value = data.data.url;
            document.getElementById('pre').src = data.data.url;
        }

        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Publicando...";
            
            const body = {
                id: document.getElementById('id').value,
                marca: document.getElementById('marca').value,
                origem: document.getElementById('origem').value,
                nome: document.getElementById('nome').value,
                preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value || "0",
                imagem: document.getElementById('imagem').value,
                maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                doce: document.getElementById('doce').value,
                amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value,
                especiado: document.getElementById('especiado').value,
                action: 'edit'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            alert("Sincronizado!");
            btn.disabled = false; btn.innerText = "Publicar Agora";
            loadData();
        };

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(c => 
                c[1].toString().toLowerCase().includes(val) || 
                c[3].toString().toLowerCase().includes(val)
            );
            currentPage = 1;
            renderList();
        }

        function updateChart(items) {
            const counts = {};
            items.forEach(r => { if(r[1]) counts[r[1]] = (counts[r[1]] || 0) + 1 });
            if (brandChart) brandChart.destroy();
            const ctx = document.getElementById('brandChart').getContext('2d');
            brandChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{ data: Object.values(counts), backgroundColor: '#c5a059', borderRadius: 5 }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { ticks: { color: '#444', font: { size: 7 } } } } }
            });
        }
    </script>
</body>
</html>
