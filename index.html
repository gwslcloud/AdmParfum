<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00160f">
    <title>Lux Admin Pro - Parfum</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/imask"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --verde-fundo: #00160f; 
            --verde-card: #002419;
            --dourado: #c5a059; 
            --branco-vidro: rgba(255, 255, 255, 0.03); 
            --borda-vidro: rgba(197, 160, 89, 0.2);
        }
        
        /* Corrigindo o Verde para Mobile */
        html, body { 
            background-color: var(--verde-fundo) !important;
            margin: 0; padding: 0; min-height: 100vh;
        }

        body { 
            font-family: 'Montserrat', sans-serif; color: white; 
            background: radial-gradient(circle at top right, var(--verde-card), var(--verde-fundo)) fixed !important;
            -webkit-font-smoothing: antialiased;
        }

        .font-luxury { font-family: 'Cinzel', serif; }
        .glass { background: var(--branco-vidro); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--borda-vidro); }

        input, textarea, select { 
            background: rgba(0,0,0,0.5) !important; 
            border: 1px solid var(--borda-vidro) !important; 
            color: white !important; padding: 14px; border-radius: 12px; outline: none; width: 100%;
        }
        input:focus, textarea:focus { border-color: var(--dourado) !important; box-shadow: 0 0 10px rgba(197, 160, 89, 0.3); }

        label { font-size: 10px; text-transform: uppercase; color: var(--dourado); letter-spacing: 1px; margin-left: 5px; font-weight: 600; }

        .btn-gold { 
            background: linear-gradient(135deg, #c5a059, #fcf6ba, #b38728); 
            color: #00160f; font-weight: 800; text-transform: uppercase; transition: 0.3s; cursor: pointer; border:none; 
        }

        .card-perfume { background: var(--verde-card); border: 1px solid var(--borda-vidro); transition: 0.3s; }
        .card-perfume:hover { transform: translateY(-3px); border-color: var(--dourado); }

        #loginOverlay { position: fixed; inset: 0; background: var(--verde-fundo); z-index: 9999; display: flex; align-items: center; justify-content: center; }

        /* Ajustes Mobile */
        @media (max-width: 768px) {
            .main-container { padding: 10px !important; }
            .stats-grid { grid-template-columns: 1fr !important; }
            .chart-container { height: 250px !important; }
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginOverlay">
        <div class="glass p-10 rounded-[40px] w-full max-w-sm text-center">
            <h1 class="font-luxury text-[#c5a059] text-4xl mb-4 tracking-[10px]">PRIVÉ</h1>
            <input type="password" id="pass" placeholder="CHAVE MESTRA" class="text-center tracking-[10px] mb-6">
            <button onclick="login()" class="btn-gold w-full py-5 rounded-2xl text-sm">Entrar no Painel</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none">
        <header class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center mb-6">
            <h1 class="font-luxury text-[#c5a059] text-xl tracking-widest uppercase">Assinatura <span class="text-white">PRO</span></h1>
            <div class="flex gap-2">
                <button onclick="loadData()" class="glass p-2 rounded-full text-xs">🔄</button>
                <button onclick="logout()" class="text-red-500 text-[10px] font-bold border border-red-500/30 px-3 py-1 rounded-full">SAIR</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 main-container pb-20">
            
            <!-- DASHBOARD -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10 stats-grid">
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 mb-1 uppercase tracking-widest">Patrimônio em Estoque</p>
                    <h2 id="statValorTotal" class="text-3xl font-luxury text-[#c5a059]">R$ 0,00</h2>
                </div>
                <div class="glass p-6 rounded-[30px] text-center">
                    <p class="text-[9px] text-gray-500 mb-1 uppercase tracking-widest">Perfumes Registrados</p>
                    <h2 id="statTotal" class="text-3xl font-luxury text-white">0</h2>
                </div>
                <div class="glass p-6 rounded-[30px] chart-container overflow-hidden">
                    <p class="text-[8px] text-[#c5a059] mb-2 uppercase text-center font-bold">Distribuição por Grife</p>
                    <canvas id="brandBarChart"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <!-- FORMULÁRIO EXPANDIDO -->
                <div class="lg:col-span-6">
                    <form id="perfumeForm" class="glass p-6 md:p-8 rounded-[35px] space-y-5">
                        <h2 id="formTitle" class="font-luxury text-[#c5a059] text-lg uppercase border-b border-white/5 pb-2">Novo Perfume</h2>
                        <input type="hidden" id="id">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div><label>Marca</label><input type="text" id="marca" required></div>
                            <div><label>Público</label>
                                <select id="categoria">
                                    <option value="Masculino">Masculino</option>
                                    <option value="Feminino">Feminino</option>
                                    <option value="Unissex">Unissex</option>
                                    <option value="Nicho">Nicho</option>
                                </select>
                            </div>
                        </div>

                        <div><label>Nome do Perfume</label><input type="text" id="nome" required></div>

                        <div class="grid grid-cols-3 gap-3">
                            <div><label>Preço</label><input type="text" id="preco" required></div>
                            <div><label>Promoção</label><input type="text" id="promocao"></div>
                            <div><label>Qtd em Estoque</label><input type="number" id="quantidade" value="1"></div>
                        </div>

                        <div><label>Código do Cupom</label><input type="text" id="cupom" placeholder="Ex: OFF10"></div>

                        <div><label>Descrição Detalhada do Perfume</label>
                            <textarea id="descricao" rows="5" placeholder="Descreva as sensações, fixação e projeção..."></textarea>
                        </div>

                        <div class="space-y-4 bg-black/20 p-4 rounded-2xl border border-white/5">
                            <p class="text-center text-[10px] font-bold text-[#c5a059] tracking-widest uppercase">Pirâmide Olfativa (Notas)</p>
                            <div><label>Notas de Topo (Saída)</label><input type="text" id="topo" placeholder="Ex: Bergamota, Limão..."></div>
                            <div><label>Notas de Coração (Corpo)</label><input type="text" id="coracao" placeholder="Ex: Rosa, Jasmim, Canela..."></div>
                            <div><label>Notas de Base (Fundo)</label><input type="text" id="base" placeholder="Ex: Baunilha, Âmbar, Cedro..."></div>
                        </div>

                        <div><label>URL da Imagem</label>
                            <div class="flex gap-4 items-center">
                                <input type="text" id="imagem" class="flex-1">
                                <img id="pre" src="" class="w-16 h-16 rounded-xl object-contain glass">
                            </div>
                        </div>

                        <div class="bg-black/40 p-4 rounded-2xl">
                            <p class="text-[9px] text-[#c5a059] font-bold text-center mb-4 tracking-widest uppercase">DNA da Fragrância (%)</p>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div><label>Doce</label><input type="number" id="doce" value="0"></div>
                                <div><label>Amadeirado</label><input type="number" id="amadeirado" value="0"></div>
                                <div><label>Cítrico</label><input type="number" id="citrico" value="0"></div>
                                <div><label>Especiado</label><input type="number" id="especiado" value="0"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between glass p-4 rounded-xl border-[#c5a059]/20 border">
                            <span class="text-[10px] uppercase font-bold text-[#c5a059]">Destaque Top Seller</span>
                            <input type="checkbox" id="maisVendido" class="w-6 h-6 accent-[#c5a059]">
                        </div>

                        <div class="flex gap-3 pt-4">
                            <button type="submit" id="saveBtn" class="btn-gold flex-1 py-5 rounded-2xl text-xs">Publicar Perfume</button>
                            <button type="button" id="delBtn" class="hidden bg-red-950/40 text-red-500 border border-red-500/20 px-6 rounded-2xl text-[10px] font-bold" onclick="excluirPerfume()">EXCLUIR</button>
                        </div>
                    </form>
                </div>

                <!-- LISTA DE PERFUMES (ORDEM POR ID) -->
                <div class="lg:col-span-6">
                    <input type="text" id="search" onkeyup="filter()" placeholder="PESQUISAR POR NOME OU MARCA..." class="w-full !rounded-full text-center text-xs tracking-[3px] py-4 glass mb-6">
                    
                    <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Itens aparecem aqui -->
                    </div>

                    <div class="mt-8 flex justify-between items-center glass p-4 rounded-full px-10">
                        <button onclick="prevPage()" class="text-[10px] text-[#c5a059] font-bold">ANTERIOR</button>
                        <span id="pageInfo" class="text-[10px] text-gray-500">Pág 1</span>
                        <button onclick="nextPage()" class="text-[10px] text-[#c5a059] font-bold">PRÓXIMA</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const WEB_APP_URL = "SUA_URL_AQUI"; 
        const SENHA_MESTRA = "ticoeteco";

        let rawData = [], filteredData = [], currentPage = 1, brandChart;
        const itemsPerPage = 10;

        const maskPrice = { mask: 'R$ num', blocks: { num: { mask: Number, thousandsSeparator: '.', padFractionalZeros: true } } };
        IMask(document.getElementById('preco'), maskPrice);
        IMask(document.getElementById('promocao'), maskPrice);

        window.onload = () => { if(localStorage.getItem('lux_auth') === 'true') { loginSucess(); } };

        function login() {
            if(document.getElementById('pass').value === SENHA_MESTRA) {
                localStorage.setItem('lux_auth', 'true');
                loginSucess();
            } else { Swal.fire('Erro', 'Chave Incorreta', 'error'); }
        }

        function loginSucess() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadData();
        }

        function logout() { localStorage.removeItem('lux_auth'); location.reload(); }

        async function loadData() {
            showSkeletons();
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                // ORDENAR POR ID (CRESCENTE: 1, 2, 3...)
                rawData = data.slice(1)
                             .filter(r => r[0] && r[3])
                             .sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
                
                filteredData = [...rawData];
                updateDashboard();
                renderList();
            } catch(e) { Swal.fire('Erro', 'Falha ao carregar nuvem', 'error'); }
        }

        function showSkeletons() {
            document.getElementById('productList').innerHTML = '<div class="h-24 glass animate-pulse rounded-2xl"></div>'.repeat(4);
        }

        function updateDashboard() {
            let totalVal = 0;
            let brandCounts = {};

            rawData.forEach(r => {
                // Cálculo inteligente de estoque: Preço * Quantidade
                const p = parseFloat(r[4].toString().replace(/[^\d,]/g, '').replace(',', '.')) || 0;
                const q = parseInt(r[17]) || 0;
                totalVal += (p * q);

                // Contagem de marcas para o novo gráfico
                const marca = r[1] || 'Sem Marca';
                brandCounts[marca] = (brandCounts[marca] || 0) + 1;
            });

            document.getElementById('statValorTotal').innerText = totalVal.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
            document.getElementById('statTotal').innerText = rawData.length;
            renderBrandChart(brandCounts);
        }

        function renderBrandChart(counts) {
            const ctx = document.getElementById('brandBarChart').getContext('2d');
            if(brandChart) brandChart.destroy();
            
            // Pega as 5 marcas com mais perfumes
            const sortedBrands = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 5);

            brandChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedBrands.map(b => b[0]),
                    datasets: [{
                        data: sortedBrands.map(b => b[1]),
                        backgroundColor: '#c5a059', borderRadius: 5
                    }]
                },
                options: { 
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: '#666', font: { size: 9 } } },
                        y: { ticks: { color: '#fff', font: { size: 9 } } }
                    },
                    maintainAspectRatio: false 
                }
            });
        }

        function renderList() {
            const list = document.getElementById('productList');
            list.innerHTML = "";
            const start = (currentPage - 1) * itemsPerPage;
            filteredData.slice(start, start + itemsPerPage).forEach(row => {
                const card = document.createElement('div');
                card.className = "card-perfume p-4 rounded-[25px] flex items-center gap-4 cursor-pointer relative";
                card.onclick = () => fillForm(row);
                card.innerHTML = `
                    <div class="text-[10px] font-bold text-[#c5a059] opacity-40">#${row[0]}</div>
                    <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center p-1"><img src="${row[6] || ''}" class="max-h-full object-contain"></div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[8px] text-[#c5a059] font-black uppercase tracking-widest">${row[1]}</p>
                        <h4 class="text-[11px] font-bold text-white uppercase truncate">${row[3]}</h4>
                        <div class="flex justify-between mt-1"><span class="text-[10px] text-gray-500">${row[4]}</span><span class="text-[8px] text-gray-400">Estoque: ${row[17] || 0}</span></div>
                    </div>
                `;
                list.appendChild(card);
            });
            document.getElementById('pageInfo').innerText = `Pág ${currentPage}`;
        }

        function fillForm(row) {
            document.getElementById('id').value = row[0];
            document.getElementById('marca').value = row[1];
            document.getElementById('nome').value = row[3];
            document.getElementById('preco').value = row[4];
            document.getElementById('promocao').value = row[5] || "";
            document.getElementById('imagem').value = row[6] || "";
            document.getElementById('pre').src = row[6] || "";
            document.getElementById('descricao').value = row[7] || "";
            document.getElementById('maisVendido').checked = row[8] == "1";
            document.getElementById('topo').value = row[9] || "";
            document.getElementById('coracao').value = row[10] || "";
            document.getElementById('base').value = row[11] || "";
            document.getElementById('categoria').value = row[12] || "Masculino";
            document.getElementById('doce').value = row[13] || 0;
            document.getElementById('amadeirado').value = row[14] || 0;
            document.getElementById('citrico').value = row[15] || 0;
            document.getElementById('especiado').value = row[16] || 0;
            document.getElementById('quantidade').value = row[17] || 1;
            document.getElementById('cupom').value = row[18] || "";
            
            document.getElementById('formTitle').innerText = "Editando Registro #" + row[0];
            document.getElementById('delBtn').classList.remove('hidden');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        document.getElementById('perfumeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerText = "Sincronizando...";

            const body = {
                id: document.getElementById('id').value || (rawData.length > 0 ? Math.max(...rawData.map(r => parseInt(r[0]))) + 1 : 1).toString(),
                marca: document.getElementById('marca').value, categoria: document.getElementById('categoria').value,
                nome: document.getElementById('nome').value, preco: document.getElementById('preco').value,
                promocao: document.getElementById('promocao').value, imagem: document.getElementById('imagem').value,
                descricao: document.getElementById('descricao').value, maisVendido: document.getElementById('maisVendido').checked ? "1" : "0",
                topo: document.getElementById('topo').value, coracao: document.getElementById('coracao').value, base: document.getElementById('base').value,
                doce: document.getElementById('doce').value, amadeirado: document.getElementById('amadeirado').value,
                citrico: document.getElementById('citrico').value, especiado: document.getElementById('especiado').value,
                quantidade: document.getElementById('quantidade').value, 
                cupom: document.getElementById('cupom').value,
                action: 'save'
            };

            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(body) });
            Swal.fire('Sucesso', 'Publicado com êxito!', 'success');
            setTimeout(loadData, 1500); clearForm();
            btn.disabled = false; btn.innerText = "Publicar Perfume";
        };

        async function excluirPerfume() {
            const res = await Swal.fire({ title: 'Excluir?', text: 'Isso é irreversível!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Sim, Apagar' });
            if (res.isConfirmed) {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: document.getElementById('id').value, action: 'delete'}) });
                Swal.fire('Apagado!', '', 'success');
                setTimeout(loadData, 1000); clearForm();
            }
        }

        function clearForm() {
            document.getElementById('perfumeForm').reset();
            document.getElementById('id').value = "";
            document.getElementById('pre').src = "";
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('formTitle').innerText = "Novo Perfume";
        }

        function filter() {
            const val = document.getElementById('search').value.toLowerCase();
            filteredData = rawData.filter(r => r[3].toLowerCase().includes(val) || r[1].toLowerCase().includes(val));
            currentPage = 1; renderList();
        }

        function prevPage() { if(currentPage > 1) { currentPage--; renderList(); } }
        function nextPage() { if(currentPage * itemsPerPage < filteredData.length) { currentPage++; renderList(); } }
        document.getElementById('imagem').oninput = (e) => { document.getElementById('pre').src = e.target.value; };
    </script>
</body>
</html>
